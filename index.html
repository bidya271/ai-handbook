    "markdown": "# CHAPTER 8: Capstone Architecture \u2014 The Autonomous Financial Risk & Compliance Auditor\n\n## 8.1 System Blueprint & Architectural Scope\n\nThis capstone module synthesizes all seven preceding layers into a unified, production-grade enterprise system: an **Autonomous Financial Risk & Compliance Auditor**. \n\nThe system processes unstructured SEC regulatory filings, corporate quarterly reports (10-Q/10-K), and transaction dispute logs, identifies non-compliant transactions or reporting variances, checks them against regulatory policies, and compiles human-audited remediation briefs.\n\n```mermaid\nflowchart TD\n    subgraph IngestionSubsystem [\"1. Ingestion & Storage Substrate\"]\n        SEC[\"Unstructured 10-K / 10-Q Filings\"] --> Extract[\"Table & Text Extraction (PyMuPDF)\"]\n        Extract --> Chunk[\"Semantic Window Chunking\"]\n        Chunk --> BGE[\"BGE-M3 Dense (1024-dim)\"]\n        Chunk --> BM25[\"BM25 Lexical Tokenizer\"]\n        BGE --> HNSW[(\"pgvector: HNSW Index\")]\n        BM25 --> GIN[(\"PostgreSQL: GIN Full-Text\")]\n    end\n\n    subgraph RetrievalSubsystem [\"2. Retrieval & Reranking Cluster\"]\n        Query[\"Audit Query\"] --> HNSW & GIN\n        HNSW -->|Top-40 Dense| RRF[\"Reciprocal Rank Fusion (k=60)\"]\n        GIN -->|Top-40 Sparse| RRF\n        RRF -->|Top-25 Fused| CE[\"Cross-Encoder Reranker\"]\n        CE -->|Top-5 High-Signal| Agent\n    end\n\n    subgraph AgentSubsystem [\"3. Stateful LangGraph Execution Graph\"]\n        Agent[\"Planner Node\"] --> Tools[\"Tool Executor Node<br/><i>execute_deterministic_variance_check</i>\"]\n        Tools --> Eval[\"Evaluator Node<br/><i>NLI Groundedness \u2265 0.95</i>\"]\n        Eval -->|Variance Delta Detected| HITL[\"Human-in-the-Loop Gate<br/><i>Compliance Officer Authorization</i>\"]\n        Eval -->|Groundedness < 0.95| Agent\n        Checkpoints[(\"agent_checkpoints<br/>PostgreSQL Ledger\")] <--> Agent\n    end\n\n    subgraph GovernanceSubsystem [\"4. Governance & Telemetry Subsystem\"]\n        HITL --> Brief[\"Remediation Brief & Report\"]\n        Brief --> OTel[\"OpenTelemetry + Langfuse Spans\"]\n        Brief --> PSI[\"PSI Semantic Drift Monitor\"]\n    end\n\n    classDef default fill:#1e293b,stroke:#6366f1,stroke-width:1.5px,color:#f8fafc;\n    classDef gate fill:#78350f,stroke:#f59e0b,stroke-width:2px,color:#fef3c7;\n    class HITL gate;\n```\n\n---\n\n## 8.2 Database Schemas: Relational, Vector & Memory\n\nThe storage substrate combines standard relational schemas, vector indexing via `pgvector`, and an append-only checkpoint ledger inside PostgreSQL.\n\n### 8.2.1 Document Ingestion & Vector Schema\n\n```sql\n-- Enable necessary extensions\nCREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";\nCREATE EXTENSION IF NOT EXISTS \"vector\";\n\n-- Master Documents Table\nCREATE TABLE financial_documents (\n    document_id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),\n    ticker VARCHAR(10) NOT NULL,\n    fiscal_year INT NOT NULL,\n    fiscal_period VARCHAR(4) NOT NULL, -- 'Q1', 'Q2', 'Q3', 'FY'\n    document_type VARCHAR(20) NOT NULL, -- '10-K', '10-Q', 'AUDIT_NOTE'\n    source_url TEXT NOT NULL,\n    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()\n);\n\n-- Hybrid Search Chunks Table\nCREATE TABLE document_chunks (\n    chunk_id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),\n    document_id UUID REFERENCES financial_documents(document_id) ON DELETE CASCADE,\n    chunk_index INT NOT NULL,\n    content TEXT NOT NULL,\n    parent_section_header TEXT NOT NULL,\n    embedding VECTOR(1024), -- BGE-Large / Cohere dimension\n    tsv_content TSVECTOR GENERATED ALWAYS AS (to_tsvector('english', content)) STORED,\n    metadata JSONB NOT NULL DEFAULT '{}'::jsonb,\n    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()\n);\n\n-- HNSW Vector Index for Dense Cosine Search\nCREATE INDEX idx_document_chunks_hnsw \nON document_chunks \nUSING hnsw (embedding vector_cosine_ops)\nWITH (m = 16, ef_construction = 64);\n\n-- Inverted GIN Index for BM25 / Sparse Full-Text Search\nCREATE INDEX idx_document_chunks_tsv \nON document_chunks \nUSING gin (tsv_content);\n```\n\n### 8.2.2 State Checkpointer Persistence Schema (LangGraph Backend)\n\n```sql\n-- State Checkpointer Ledger\nCREATE TABLE agent_checkpoints (\n    thread_id UUID NOT NULL,\n    checkpoint_id UUID NOT NULL,\n    parent_checkpoint_id UUID,\n    node_name VARCHAR(64) NOT NULL,\n    state_payload JSONB NOT NULL,\n    created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),\n    PRIMARY KEY (thread_id, checkpoint_id)\n);\n\nCREATE INDEX idx_checkpoints_lookup \nON agent_checkpoints (thread_id, created_at DESC);\n```\n\n---\n\n## 8.3 State Management & Data Contracts (Pydantic)\n\nTo maintain deterministic integrity across transitions, the agent state and tool parameters are governed by strict Pydantic definitions.\n\n### 8.3.1 Graph State Definition\n\n```python\nfrom typing import TypedDict, List, Dict, Any, Optional, Annotated\nimport operator\nfrom pydantic import BaseModel, Field\n\nclass Finding(BaseModel):\n    policy_id: str = Field(..., description=\"ID of the infringed policy\")\n    discrepancy_amount: float = Field(..., description=\"Absolute variance in USD\")\n    variance_percentage: float = Field(..., description=\"Calculated percentage delta\")\n    source_citation: str = Field(..., description=\"Exact document and paragraph citation\")\n    severity: str = Field(..., regex=r\"^(LOW|MEDIUM|HIGH|CRITICAL)$\")\n\nclass AuditorState(TypedDict):\n    # Session identifiers\n    thread_id: str\n    target_entity: str\n    fiscal_scope: str\n    \n    # Message logs with append reducer\n    messages: Annotated[List[Dict[str, str]], operator.add]\n    \n    # Internal variables\n    retrieved_contexts: List[str]\n    sql_query_to_run: Optional[str]\n    raw_ledger_data: Optional[List[Dict[str, Any]]]\n    identified_findings: Annotated[List[Finding], operator.add]\n    \n    # Control flags\n    retry_count: int\n    groundedness_score: float\n    requires_human_approval: bool\n    current_status: str\n```\n\n### 8.3.2 Production Sandboxed Tool Contracts\n\n```python\nclass LedgerSQLQueryInput(BaseModel):\n    merchant_id: str = Field(..., regex=r\"^MER-[0-9]{4}-[A-Z0-9]{4}$\")\n    fiscal_quarter: str = Field(..., regex=r\"^202[0-9]-Q[1-4]$\")\n    aggregate_by: str = Field(..., regex=r\"^(MONTH|CATEGORY|CURRENCY)$\")\n    row_limit: int = Field(default=50, ge=1, le=100)\n\nclass DeterministicVarianceCalcInput(BaseModel):\n    stated_total: float = Field(..., description=\"Number extracted from SEC filing text\")\n    calculated_sum: float = Field(..., description=\"Sum derived from raw transaction rows\")\n    tolerance_threshold: float = Field(default=0.005, description=\"Allowed rounding variance (0.5%)\")\n\nclass DeterministicVarianceCalcOutput(BaseModel):\n    variance_abs: float\n    variance_pct: float\n    is_breached: bool\n    formula_trace: str\n```\n\n---\n\n## 8.4 Deterministic Tool Implementation & Sandboxing\n\nThe agent is never permitted to perform mental math or execute raw unchecked database strings.\n\n```python\ndef execute_deterministic_variance_check(inputs: DeterministicVarianceCalcInput) -> DeterministicVarianceCalcOutput:\n    \"\"\"Executes float math in a sandboxed, deterministic runtime.\"\"\"\n    stated = inputs.stated_total\n    actual = inputs.calculated_sum\n    \n    variance_abs = round(abs(stated - actual), 4)\n    variance_pct = round((variance_abs / (stated if stated != 0 else 1.0)), 6)\n    is_breached = variance_pct > inputs.tolerance_threshold\n    \n    trace = f\"|{stated} - {actual}| = {variance_abs} -> ({variance_abs} / {stated}) = {variance_pct * 100:.4f}%\"\n    \n    return DeterministicVarianceCalcOutput(\n        variance_abs=variance_abs,\n        variance_pct=variance_pct,\n        is_breached=is_breached,\n        formula_trace=trace\n    )\n```\n\n---\n\n## 8.5 State Graph Orchestration Logic\n\nThe engine executes as a state machine containing planning, tool calling, automated evaluation, and interrupt gates.\n\n```python\nfrom langgraph.graph import StateGraph, END\n\n# Initialize State Machine Builder\nbuilder = StateGraph(AuditorState)\n\n# 1. Define Nodes\ndef planner_node(state: AuditorState) -> Dict[str, Any]:\n    \"\"\"Analyzes the audit scope, inspects findings, and decides the next action.\"\"\"\n    # Invokes base LLM with system prompts & tool definitions\n    return {\"current_status\": \"RETRIEVING_CONTEXT\", \"retry_count\": state[\"retry_count\"]}\n\ndef retrieval_node(state: AuditorState) -> Dict[str, Any]:\n    \"\"\"Runs Hybrid Dense + Sparse Search via SQL engine and passes results to Reranker.\"\"\"\n    # Executes Chapter 4 RRF search pipeline\n    return {\"retrieved_contexts\": [\"Chunk 1...\", \"Chunk 2...\"], \"current_status\": \"EXECUTING_TOOLS\"}\n\ndef tool_execution_node(state: AuditorState) -> Dict[str, Any]:\n    \"\"\"Executes Pydantic-validated deterministic tools against read-replicas.\"\"\"\n    # Runs execute_deterministic_variance_check\n    return {\"current_status\": \"EVALUATING_FINDINGS\"}\n\ndef groundedness_eval_node(state: AuditorState) -> Dict[str, Any]:\n    \"\"\"Computes Groundedness score (Chapter 7) using NLI checks.\"\"\"\n    score = 0.98 # Calculated dynamically via LLM-as-a-Judge\n    return {\n        \"groundedness_score\": score,\n        \"requires_human_approval\": score >= 0.95 and len(state[\"identified_findings\"]) > 0,\n        \"current_status\": \"AUDIT_READY\" if score >= 0.95 else \"FAILED_EVAL\"\n    }\n\ndef human_approval_gate(state: AuditorState) -> Dict[str, Any]:\n    \"\"\"Suspension point. Graph persists state and emits webhook.\"\"\"\n    return {\"current_status\": \"COMPLETED\"}\n\n# 2. Add Nodes to Graph\nbuilder.add_node(\"planner\", planner_node)\nbuilder.add_node(\"retriever\", retrieval_node)\nbuilder.add_node(\"tool_executor\", tool_execution_node)\nbuilder.add_node(\"evaluator\", groundedness_eval_node)\nbuilder.add_node(\"human_gate\", human_approval_gate)\n\n# 3. Define Edges and Conditional Transitions\nbuilder.set_entry_point(\"planner\")\nbuilder.add_edge(\"planner\", \"retriever\")\nbuilder.add_edge(\"retriever\", \"tool_executor\")\nbuilder.add_edge(\"tool_executor\", \"evaluator\")\n\ndef evaluate_transition(state: AuditorState) -> str:\n    if state[\"groundedness_score\"] < 0.95:\n        if state[\"retry_count\"] < 3:\n            return \"retry_planner\"\n        return \"abort_to_failure\"\n    if state[\"requires_human_approval\"]:\n        return \"require_hitl\"\n    return \"finalize\"\n\nbuilder.add_conditional_edges(\n    \"evaluator\",\n    evaluate_transition,\n    {\n        \"retry_planner\": \"planner\",\n        \"abort_to_failure\": END,\n        \"require_hitl\": \"human_gate\",\n        \"finalize\": END\n    }\n)\n\n# Interrupt condition for Human-in-the-Loop\ngraph = builder.compile(interrupt_before=[\"human_gate\"])\n```\n\n---\n\n## 8.6 Telemetry, Drift & Automated Regression Testing\n\n### 8.6.1 CI/CD Evaluation Pipeline (`test_rag_pipeline.py`)\n\nEvery pull request runs deterministic and probabilistic evaluation assertions prior to model/prompt deployment:\n\n```python\nimport pytest\nfrom ragas.metrics import faithfulness, context_recall, answer_relevance\n\ndef test_audit_rag_pipeline_regression():\n    # Load gold-standard baseline dataset\n    test_cases = [\n        {\n            \"query\": \"What was the variance in merchant M-881 adjustment reserves?\",\n            \"ground_truth_context\": \"Merchant M-881 adjustment reserves increased by $1.2M due to legacy arbitration.\",\n            \"ground_truth_answer\": \"The variance was an increase of $1.2M.\"\n        }\n    ]\n    \n    for case in test_cases:\n        result = run_full_agent_pipeline(case[\"query\"])\n        \n        # 1. Assert Schema Conformance\n        assert isinstance(result[\"identified_findings\"], list)\n        \n        # 2. Assert Quality Thresholds\n        faithfulness_score = faithfulness.score(result, case)\n        assert faithfulness_score >= 0.95, f\"Faithfulness dropped to {faithfulness_score}\"\n        \n        context_score = context_recall.score(result, case)\n        assert context_score >= 0.90, f\"Context recall failed: {context_score}\"\n```\n\n### 8.6.2 Population Stability Index (PSI) Drift Monitor\n\nAn automated scheduled cron job computes vector drift across production queries:\n\n```python\nimport numpy as np\n\ndef calculate_embedding_drift_psi(baseline_embeddings: np.ndarray, production_embeddings: np.ndarray, buckets: int = 10) -> float:\n    \"\"\"Computes PSI across high-dimensional centroid distances to detect semantic drift.\"\"\"\n    # Compute centroid of baseline\n    baseline_centroid = np.mean(baseline_embeddings, axis=0)\n    \n    # Calculate cosine distances to centroid\n    base_dists = 1.0 - np.dot(baseline_embeddings, baseline_centroid)\n    prod_dists = 1.0 - np.dot(production_embeddings, baseline_centroid)\n    \n    # Create quantile buckets\n    quantiles = np.linspace(0, 100, buckets + 1)\n    bins = np.percentile(base_dists, quantiles)\n    bins[0] = -np.inf\n    bins[-1] = np.inf\n    \n    base_counts, _ = np.histogram(base_dists, bins=bins)\n    prod_counts, _ = np.histogram(prod_dists, bins=bins)\n    \n    base_pct = np.clip(base_counts / len(base_dists), 1e-4, 1.0)\n    prod_pct = np.clip(prod_counts / len(prod_dists), 1e-4, 1.0)\n    \n    psi = np.sum((prod_pct - base_pct) * np.log(prod_pct / base_pct))\n    return float(psi)\n```\n\n---\n\n## 8.7 Complete Production Verification Checklist\n\nBefore issuing production access keys, this checklist must be satisfied:\n\n### 1. Ingestion & Storage Architecture\n- [ ] Database read-replicas configured with a dedicated read-only role (`GRANT SELECT ON ...`).\n- [ ] HNSW vector indexes indexed with `vector_cosine_ops` using `m=16` and `ef_construction=64`.\n- [ ] Document chunks include full AST structural breadcrumb headers (`Chapter > Section > Subheading`).\n- [ ] Inverted Full-Text search indexes (`gin (tsv_content)`) configured with language-appropriate stemming dictionaries.\n\n### 2. Retrieval & Reranking Cluster\n- [ ] Dense search and Sparse BM25 combined using Reciprocal Rank Fusion with $k=60$.\n- [ ] Cross-Encoder reranker deployed with batch size limits to cap P99 latency below 350ms.\n- [ ] Maximum retrieved candidates into reranker capped at 50 records.\n\n### 3. Agentic Orchestration & Determinism\n- [ ] All tool inputs and outputs strictly bound to Pydantic models.\n- [ ] Zero arbitrary code execution paths; calculations offloaded to sandboxed scalar functions.\n- [ ] State Graph initialized with a persistent PostgreSQL checkpointer for session recovery.\n- [ ] Recursion limits strictly capped at `max_iterations = 8`.\n- [ ] All high-risk mutations guarded with an explicit `interrupt_before` approval gate.\n\n### 4. Serving Infrastructure & Sizing\n- [ ] Runtimes configured with PagedAttention and continuous iteration batching (vLLM / TensorRT-LLM).\n- [ ] Total KV cache footprint sized to fit within GPU VRAM with a 20% buffer for peak concurrency.\n- [ ] Models quantized using AWQ (W4A16) or native FP8 (E4M3) with verified zero-loss regression.\n- [ ] Time-To-First-Token (TTFT) and Inter-Token Latency (ITL) instrumented with OpenTelemetry.\n\n### 5. Safety, Governance & Compliance (EU AI Act)\n- [ ] Delimiter Sandboxing applied to all untrusted document ingestion strings.\n- [ ] Input classifiers active to intercept direct and indirect prompt injection attempts.\n- [ ] Groundedness evaluation filter halts and escalates responses scoring below 0.95.\n- [ ] Automated PSI monitoring configured with alerting thresholds set at $\\text{PSI} \\ge 0.15$.\n- [ ] Audit trails (thread ID, checkpoint state, prompt git SHA, model snapshot) stored for regulatory compliance under Article 12 & 14.\n"

    "summary": "The 30-60-30 Protocol: Compressing 9 Months into an Intensive 8-Week AI Engineering Sprint",
    "markdown": "# CHAPTER 9: The Accelerated Fast-Track Roadmap \u2014 The 60-Day / 8-Week AI Engineering Hyper-Sprint\n\n## 9.1 Architectural Overview & Sprint Philosophy\n\nTraditional academic or corporate training paths allocate **9 to 12 months** to learn modern artificial intelligence. In practice, long timelines foster \"tutorial hell\": learners passively watch video walkthroughs, rely on bloated orchestration frameworks that obscure the underlying mechanics, and forget early math by the time they reach deployment.\n\nThe **Accelerated Fast-Track Roadmap** compresses this trajectory into an aggressive, intensive **8-Week (60-Day) Hyper-Sprint**. This compression is achieved through three core engineering principles:\n\n1. **First-Principles Implementation (Zero Black-Box Wrappers):** You do not start by importing high-level abstractions like LangChain or AutoTrain. You construct tokenizers, scaled dot-product attention, LoRA projection layers, and state machines from bare mathematical primitives in PyTorch and Python.\n2. **The 30-60-30 Daily Deliberate Practice Protocol:** Every single working day is divided into three non-negotiable operational blocks totaling 2 hours of focused output.\n3. **Verifiable Gate Milestones (Exit Criteria):** Progression between sprint phases is gated by automated test suites and production deployments\u2014not by hours watched or chapters read.\n\n```mermaid\nflowchart TD\n    subgraph Phase1 [\"Phase 1: Foundations (Days 1\u201314)\"]\n        P1A[\"Tensors, Strides & Memory Layouts\"] --> P1B[\"Byte-level BPE Tokenizer from Scratch\"]\n        P1B --> P1C[\"Embedding Matrix & RoPE Coordinate Math\"]\n        P1C --> P1D[\"Scaled Dot-Product & Causal Attention\"]\n        P1D --> Gate1{{\"Gate 1: Bare-Metal Transformer Decoder Block\"}}\n    end\n\n    subgraph Phase2 [\"Phase 2: Adaptation (Days 15\u201328)\"]\n        Gate1 --> P2A[\"Cross-Entropy Loss & AdamW Memory Wall\"]\n        P2A --> P2B[\"LoRA Low-Rank Decomposition (W0 + BA)\"]\n        P2B --> P2C[\"QLoRA NormalFloat4 (NF4) Quantization\"]\n        P2C --> P2D[\"Preference Alignment (DPO vs. RLHF)\"]\n        P2D --> Gate2{{\"Gate 2: Fine-Tuned 8B Schema Engine on 1 GPU\"}}\n    end\n\n    subgraph Phase3 [\"Phase 3: Retrieval & Agents (Days 29\u201342)\"]\n        Gate2 --> P3A[\"Semantic Window Chunking & AST Parsing\"]\n        P3A --> P3B[\"pgvector HNSW + PostgreSQL BM25 Indexing\"]\n        P3B --> P3C[\"Reciprocal Rank Fusion & Cross-Encoders\"]\n        P3C --> P3D[\"LangGraph Stateful Cycles & Deterministic Tools\"]\n        P3D --> Gate3{{\"Gate 3: Self-Correcting SQL Audit Agent with HITL\"}}\n    end\n\n    subgraph Phase4 [\"Phase 4: Serving & Capstone (Days 43\u201360)\"]\n        Gate3 --> P4A[\"vLLM Serving, PagedAttention & Roofline Model\"]\n        P4A --> P4B[\"The RAG Triad, NLI Evals & Guardrails\"]\n        P4B --> P4C[\"Capstone Assembly: Financial Auditor\"]\n        P4C --> P4D[\"EU AI Act Compliance & OpenTelemetry Spans\"]\n        P4D --> Gate4{{\"Gate 4: Production Deployment & Live Audit Run\"}}\n    end\n\n    classDef default fill:#1e293b,stroke:#6366f1,stroke-width:1.5px,color:#f8fafc;\n    classDef gate fill:#78350f,stroke:#f59e0b,stroke-width:2px,color:#fef3c7;\n    class Gate1,Gate2,Gate3,Gate4 gate;\n```\n\n---\n\n## 9.2 The 30-60-30 Daily Deliberate Practice Protocol\n\nTo achieve industry-level fluency in 60 days, you must engage in high-intensity **deliberate practice**. Casual reading yields zero retention when debugging a distributed CUDA kernel or resolving an agentic state cycle under production load.\n\n```mermaid\nflowchart LR\n    Block1[\"<b>Block 1: 30 Minutes</b><br/>Architectural & Mathematical Deconstruction<br/><i>(Paper Reading & LaTeX Derivations)</i>\"] \n    --> Block2[\"<b>Block 2: 60 Minutes</b><br/>Bare-Metal Code Implementation<br/><i>(Line-by-Line PyTorch / Python Code)</i>\"] \n    --> Block3[\"<b>Block 3: 30 Minutes</b><br/>Benchmarking, Git Commit & Architecture Log<br/><i>(Verification, Trace Logging & PR)</i>\"]\n\n    classDef default fill:#1e293b,stroke:#6366f1,stroke-width:1.5px,color:#f8fafc;\n    classDef active fill:#312e81,stroke:#818cf8,stroke-width:2px,color:#ffffff;\n    class Block2 active;\n```\n\n### The Three Execution Blocks:\n\n#### Block 1: Architectural Deconstruction (30 Minutes)\n- **Objective:** Dissect the day's foundational paper or mathematical equation before looking at high-level code.\n- **Protocol:**\n  1. Open the original research paper (e.g., Vaswani 2017 for Attention, Hu 2021 for LoRA, Dettmers 2023 for QLoRA).\n  2. Re-derive the core mathematical equations on paper or an iPad using linear algebra notations:\n     $$\\text{Attention}(Q, K, V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}} + M\\right)V$$\n  3. Map every tensor dimension: shape of inputs, intermediate projection weights, stride configurations, and floating-point precision budgets.\n\n#### Block 2: Bare-Metal Implementation (60 Minutes)\n- **Objective:** Code the mathematical concept from scratch without high-level wrapper libraries.\n- **Protocol:**\n  1. Fire up a clean Python/PyTorch development file.\n  2. Implement the algorithm line by line using raw tensors, matrix multiplications (`torch.matmul` or `@`), and boolean masks.\n  3. Include strict assertion tests confirming output shapes, gradient backward-pass flows, and numeric boundary behavior (handling `NaN`, `Inf`, and zero divisions).\n\n#### Block 3: Verification, Profiling & Public Commit (30 Minutes)\n- **Objective:** Benchmark execution characteristics and log an immutable record of engineering output.\n- **Protocol:**\n  1. Profile VRAM allocation (`torch.cuda.memory_allocated()`) and runtime execution latency.\n  2. Commit code to your public GitHub repository with an engineering post-mortem: *What broke? Why did the naive approach fail? What is the physical hardware constraint?*\n  3. Tag the commit with the sprint day milestone (e.g., `Day 14: Completed Gate 1 - Bare-metal Transformer Decoder`).\n\n---\n\n## 9.3 Phase 1 (Days 1\u201314): The Mechanical Substrate & Core Linear Algebra\n\n```text\nFocus: Tensors, Memory Contiguity, Tokenizers, Embeddings, Positional Encoding & Self-Attention\nTarget Hardware: Standard laptop or 1x Google Colab Free T4 GPU\n```\n\n### Day-by-Day Execution Matrix:\n\n| Day | Core Architectural Topic | Daily Deliverable & Implementation |\n|---|---|---|\n| **Day 1** | **Tensor Strides & Physical Storage** | Write a C-contiguous vs. Fortran-contiguous tensor benchmark in NumPy/PyTorch. Demonstrate how `tensor.view()` differs from `tensor.reshape()` in memory reallocation. |\n| **Day 2** | **Byte Spectrum & Text Normalization** | Implement Unicode normalization (NFC/NFKC) and regex sub-word splitting rules. Deconstruct why naive character-level and word-level tokenizers fail. |\n| **Day 3\u20134** | **Byte-Pair Encoding (BPE) from Scratch** | Code a complete BPE training algorithm: frequency counting, adjacent pair merging, and vocabulary construction. Train a 1,000-token custom tokenizer on financial reports. |\n| **Day 5** | **The Embedding Layer ($W_E$) Mechanics** | Implement the embedding lookup as both a one-hot matrix multiplication and an $O(1)$ memory index scan. Benchmark the 1000x speedup of direct pointer offsets. |\n| **Day 6** | **High-Dimensional Latent Geometry** | Calculate Dot Product, Euclidean Distance ($L_2$), and Cosine Similarity across embedding vectors. Demonstrate embedding anisotropy (The Cone Effect) on random vs. trained vectors. |\n| **Day 7** | **Absolute vs. Relative Positional Encoding** | Derive the original sinusoidal positional encoding equations. Demonstrate mathematical failure when prompt sequence length exceeds the hard-coded training ceiling. |\n| **Day 8\u20139** | **Rotary Position Embedding (RoPE)** | Implement RoPE 2D complex coordinate rotations in PyTorch. Prove mathematically that $\\langle R_m q, R_n k \\rangle$ depends strictly on relative offset $(n - m)$. |\n| **Day 10** | **Linear Projections ($Q, K, V$)** | Code linear projections using PyTorch tensor contractions. Build the SQL relational join mental model linking Queries, Keys, and Values. |\n| **Day 11** | **Scaled Dot-Product & Gradient Saturation** | Implement $\\text{softmax}(QK^T / \\sqrt{d_k})$. Run numeric simulations demonstrating how omitting $\\sqrt{d_k}$ pushes softmax gradients to zero when $d_k = 128$. |\n| **Day 12** | **Autoregressive Causal Masking** | Construct upper-triangular causal masks with $-\\infty$. Verify that future tokens receive exactly $0.0$ attention weight after softmax normalization. |\n| **Day 13** | **Grouped-Query Attention (GQA)** | Build a modular attention layer supporting Multi-Head Attention (MHA), Multi-Query Attention (MQA), and Grouped-Query Attention (GQA). Compute KV cache savings. |\n| **Day 14** | **GATE 1 MILESTONE** | **Synthesize a working 4-layer Decoder-Only Transformer block from scratch.** Validate forward generation on a toy corpus with loss backpropagation. |\n\n---\n\n## 9.4 Phase 2 (Days 15\u201328): Efficient Adaptation & Optimization\n\n```text\nFocus: Loss Functions, AdamW Memory Footprint, LoRA, QLoRA (NF4) & Alignment (DPO)\nTarget Hardware: 1x Consumer GPU (RTX 3090, 4090, or Colab A100)\n```\n\n### Day-by-Day Execution Matrix:\n\n| Day | Core Architectural Topic | Daily Deliverable & Implementation |\n|---|---|---|\n| **Day 15** | **Cross-Entropy Loss & Softmax Calculus** | Derive cross-entropy loss from negative log-likelihood. Implement perplexity calculation ($PPL = e^{\\mathcal{L}_{\\text{CE}}}$) and analyze loss spikes during training. |\n| **Day 16** | **Backpropagation & The Error Chain Rule** | Trace the multivariate calculus chain rule through an attention block. Compute exact weight gradients ($\\partial \\mathcal{L} / \\partial W$) manually. |\n| **Day 17** | **AdamW Optimizer States & The Memory Wall** | Implement AdamW momentum ($m_t$) and variance ($v_t$) tracking. Write the exact calculation proving why a 70B model requires 1,120 GB VRAM for full 16-bit fine-tuning. |\n| **Day 18** | **The Intrinsic Rank Hypothesis** | Perform Singular Value Decomposition (SVD) on weight update matrices ($\\Delta W$). Prove that 90%+ of update variance is captured in rank $r \\le 16$. |\n| **Day 19\u201320** | **LoRA Implementation from Scratch** | Build a custom `LoRALinear` layer in PyTorch: freeze $W_0$, initialize $A \\sim \\mathcal{N}(0, \\sigma^2)$ and $B = 0$, apply scaling $\\frac{\\alpha}{r}$. Train on an instruction dataset. |\n| **Day 21** | **Weight Merging & Zero-Latency Inference** | Implement the mathematical weight collapse: $W_{\\text{prod}} = W_0 + \\frac{\\alpha}{r}(BA)$. Verify that the merged model produces identical outputs with zero runtime latency overhead. |\n| **Day 22** | **Block Quantization & Dynamic Scaling** | Implement standard FP16 to INT8 block quantization. Compute scale factors ($S = \\text{absmax}(X) / 127$) and measure quantization error on weight activations. |\n| **Day 23\u201324** | **QLoRA: NormalFloat4 (NF4) Mechanics** | Deconstruct NormalFloat4 information-theoretically. Implement Double Quantization and analyze Paged Optimizers for offloading spike activations to CPU RAM. |\n| **Day 25** | **Supervised Fine-Tuning (SFT) Data ETL** | Build a high-throughput JSONL data pipeline with packing: concatenate multiple conversations up to max sequence length to eliminate padding token compute waste. |\n| **Day 26\u201327** | **Preference Alignment: DPO vs. RLHF** | Derive the Direct Preference Optimization (DPO) loss equation from the Bradley-Terry preference model: $\\mathcal{L}_{\\text{DPO}} = -\\log \\sigma \\left(\\beta \\log \\frac{\\pi_\\theta(y_w \\mid x)}{\\pi_{\\text{ref}}(y_w \\mid x)} - \\beta \\log \\frac{\\pi_\\theta(y_l \\mid x)}{\\pi_{\\text{ref}}(y_l \\mid x)}\\right)$. |\n| **Day 28** | **GATE 2 MILESTONE** | **Adapt an open-source 8B foundation model using QLoRA on a single GPU.** Enforce strict, valid Pydantic JSON schema generation with zero syntax errors. |\n\n---\n\n## 9.5 Phase 3 (Days 29\u201342): Production Hybrid Retrieval & Stateful Agent Graphs\n\n```text\nFocus: Chunking ETL, pgvector HNSW, BM25, RRF, Cross-Encoders & LangGraph State Machines\nTarget Infrastructure: PostgreSQL with pgvector, Python 3.11+, LangGraph\n```\n\n### Day-by-Day Execution Matrix:\n\n| Day | Core Architectural Topic | Daily Deliverable & Implementation |\n|---|---|---|\n| **Day 29** | **Semantic Window Chunking & AST Parsing** | Build an ingestion parser using PyMuPDF and Markdown AST tokenizers. Implement structural breadcrumb injection (`Document > Chapter > Section > Paragraph`). |\n| **Day 30** | **Embedding Generation & Batching** | Generate dense vector embeddings using BGE-M3 (1,024-dim). Measure embedding generation throughput across varying batch sizes and context lengths. |\n| **Day 31** | **pgvector HNSW Graph Configuration** | Deploy PostgreSQL with `pgvector`. Configure HNSW index hyperparameters: `m = 16`, `ef_construction = 64`. Benchmark query latency vs. recall. |\n| **Day 32** | **Sparse Lexical Search: BM25 in PostgreSQL** | Configure PostgreSQL Full-Text Search with `tsv_content TSVECTOR` and GIN indexing. Benchmark keyword precision on numeric codes, invoice IDs, and acronyms. |\n| **Day 33** | **Reciprocal Rank Fusion (RRF) Pipeline** | Code the RRF aggregation algorithm: $\\text{RRF}(d) = \\sum_{m \\in M} \\frac{1}{k + r_m(d)}$ with $k=60$. Combine Top-40 dense and Top-40 sparse candidates into Top-25 fused results. |\n| **Day 34** | **Cross-Encoder Reranking Optimization** | Deploy a cross-encoder reranker (`bge-reranker-large`). Benchmark latency tradeoffs: reranking Top-25 vs. Top-100 candidates to maintain P99 latency below 350ms. |\n| **Day 35** | **Lost-in-the-Middle Context Packing** | Implement context injection ordering: place the highest-scoring reranked chunks at the extreme beginning and extreme end of the prompt window to pute Regimes** | Profile Prefill (compute-bound) vs. Decode (memory-bandwidth bound) on physical hardware. Plot the Roofline Model for your target GPU architecture. |\n| **Day 44** | **PagedAttention & Virtual Memory Translation** | Deconstruct vLLM block allocation. Implement a software simulation of logical-to-physical block mapping tables, demonstrating recovery of 60\u201380% wasted VRAM. |\n| **Day 45** | **Continuous Iteration-Level Batching** | Deploy a serving engine with dynamic request insertion and eviction. Benchmark throughput (tokens/sec) vs. static lockstep batching under variable query lengths. |\n| **Day 46** | **Production Quantization (AWQ & FP8)** | Quantize an 8B/70B model to AWQ (4-bit) and FP8 (E4M3). Measure latency improvement, VRAM footprint reduction, and run perplexity benchmarks. |\n| **Day 47** | **The RAG Triad: Automated Metric Suite** | Implement automated scoring pipelines for Context Relevance, Groundedness (NLI proposition decomposition), and Answer Relevance using Ragas. |\n| **Day 48** | **LLM-as-a-Judge Calibration** | Engineer calibrated judge prompts: anchored integer rubrics, permutation swapping (position invariance), and chain-of-thought extraction before scoring. |\n| **Day 49** | **Adversarial Ingress Guardrails** | Implement Delimiter Sandboxing (`<UNTRUSTED_DOCUMENT_PAYLOAD>`) and deploy a fast ingress classifier (Llama-Guard) to intercept direct and indirect prompt injections. |\n| **Day 50** | **Output Egress Scanners & Redaction** | Build regex and checksum scanners (Luhn algorithm) at API egress to intercept leaked credit card numbers, SSNs, and system prompt tokens before delivery. |\n| **Day 51** | **Semantic Drift Monitoring (PSI)** | Implement a scheduled cron job computing Population Stability Index (PSI) over high-dimensional query embeddings. Set automated alerts for $\\text{PSI} \\ge 0.15$. |\n| **Day 52** | **OpenTelemetry Distributed Tracing** | Instrument generation pipelines with OpenTelemetry spans: trace `prompt_tokens`, `completion_tokens`, TTFT, ITL, tool execution times, and USD cost attribution. |\n| **Day 53\u201356** | **Capstone Construction: Financial Risk Auditor** | Assemble all layers into the Capstone Architecture (Chapter 8): Ingestion $\\rightarrow$ Hybrid pgvector Index $\\rightarrow$ LangGraph Machine $\\rightarrow$ Evals $\\rightarrow$ Telemetry Sink. |\n| **Day 57** | **EU AI Act & Governance Compliance** | Author the technical documentation required under Articles 9\u201314 for High-Risk AI systems: data lineage audit, risk management file, and human oversight architecture. |\n| **Day 58** | **End-to-End Automated Regression Suite** | Build a CI/CD test suite (`pytest`) executing 50 gold-standard audit scenarios. Enforce zero regression: Groundedness $\\ge 0.95$ and Schema Validity $= 100\\%$. |\n| **Day 59** | **Load Testing & Latency SLA Profiling** | Run Locust load tests simulating 30 concurrent users. Profile P95 Time-To-First-Token (TTFT) and verify that KV cache allocation never triggers page thrashing. |\n| **Day 60** | **GATE 4 CAPSTONE COMPLETION** | **Deploy the production system live.** Publish the codebase, benchmark reports, and interactive demo. Tag production release `v1.0.0`. |\n\n---\n\n## 9.7 Cognitive Operating System & Debugging Protocols\n\nWhen undergoing an intensive 60-day sprint, you will inevitably hit cognitive and technical walls. Use these diagnostic checklists to unblock execution immediately:\n\n### 1. The Tensor Dimension & Matrix Multiplication Mismatch\n- **Symptom:** `RuntimeError: The size of tensor a (512) must match the size of tensor b (128) at non-singleton dimension 2`.\n- **Diagnostic:** Print `tensor.shape` and `tensor.stride()` before every matrix multiplication. Write the algebraic dimension contract on paper:\n  $$(B, H, S, d_k) \\times (B, H, d_k, S) \\longrightarrow (B, H, S, S)$$\n- **Rule:** Never use `tensor.view()` without verifying that memory is contiguous. Call `tensor.contiguous()` if strides were altered by transpose operations.\n\n### 2. CUDA Out-Of-Memory (`CUDA OOM`) During Decode\n- **Symptom:** Runtimes crash during autoregressive generation even when initial prefill succeeded.\n- **Diagnostic:** The static model weights fit, but dynamic KV cache accumulation exceeded remaining VRAM headroom.\n- **Rule:** Calculate exact KV cache overhead using the Universal Formula:\n  $$\\text{KV VRAM (GB)} = \\frac{2 \\times \\text{Bytes} \\times n_{\\text{layers}} \\times n_{\\text{heads\\_kv}} \\times d_{\\text{head}} \\times S \\times B}{10^9}$$\n  If running consumer hardware, switch from MHA to GQA, quantize KV cache to FP8, or enforce PagedAttention block pooling.\n\n### 3. Agentic Infinite Looping\n- **Symptom:** The state machine repeatedly loops between Planner and Tool Executor without reaching completion.\n- **Diagnostic:** The tool returned an error string that the LLM cannot parse, or the conditional edge transition function lacks an incrementing escape hatch.\n- **Rule:** Every state machine must include an explicit `retry_count` integer in its state schema. The conditional edge must strictly route to an abort/escalate node when `retry_count >= 3`.\n\n---\n\n## 9.8 Chapter Summary Checkpoint\n\n1. **The 60-Day Sprint** succeeds by eliminating black-box wrappers and building from raw mathematical and tensor primitives.\n2. **The 30-60-30 Protocol** balances theoretical deconstruction (30m), hands-on line-by-line implementation (60m), and verifiable benchmark logging (30m).\n3. **Four Verifiable Gate Milestones** enforce mastery:\n   - *Gate 1 (Day 14):* Bare-metal Decoder-only Transformer in PyTorch.\n   - *Gate 2 (Day 28):* QLoRA fine-tuned 8B model with 100% Pydantic schema adherence.\n   - *Gate 3 (Day 42):* Self-correcting LangGraph SQL agent with human approval breakpoint.\n   - *Gate 4 (Day 60):* Full Capstone Financial Risk Auditor deployed with OpenTelemetry tracing and EU AI Act compliance.\n"

    "markdown": "# CHAPTER 10: The \"Build in Public\" Portfolio, Technical Post-Mortem & Industry Authority Playbook\n\n## 10.1 Architectural Overview: The Proof-of-Work Standard in AI Engineering\n\nTheory without functional, reproducible artifacts carries zero weight in production engineering. In the modern AI talent market, generic \"toy projects\" (e.g., calling OpenAI APIs via Streamlit, basic PDF chatbots, or uninspected LangChain tutorials) are instantly dismissed during technical screenings.\n\nSenior AI Architects, Staff Engineers, and Engineering Directors look for a distinct standard: **Production Proof-of-Work**. \n\nProduction Proof-of-Work demonstrates that an engineer understands what happens beneath high-level abstractions:\n1. **Mathematical Grounding:** You can derive self-attention variance, RoPE coordinate rotations, and cross-entropy loss from linear algebra primitives.\n2. **Hardware & Resource Consciousness:** You size inference infrastructure using memory bandwidth roofline models, calculate KV cache VRAM per token, and prevent CUDA out-of-memory cascades.\n3. **Resilience & Determinism:** You treat foundation models as probabilistic components inside deterministic state graphs with strict Pydantic data contracts and self-correction loops.\n4. **Failure Transparency:** You document architectural breakdowns, performance bottlenecks, and incident root-cause analyses (RCAs) with engineering rigor.\n\n```mermaid\nflowchart TD\n    subgraph Development [\"1. Production-Grade Implementation\"]\n        Code[\"Bare-Metal Codebase (No Black-Box Wrappers)\"] --> Bench[\"Hardware Profiling (VRAM, TTFT, TPS Rooflines)\"]\n        Bench --> CI[\"Automated CI/CD Eval Suite (Ragas Groundedness \u2265 0.95)\"]\n    end\n\n    subgraph Documentation [\"2. Public Proof-of-Work Artifact\"]\n        CI --> Readme[\"Executive README (Architecture SVG + Benchmark Tables)\"]\n        Readme --> RCA[\"Technical Incident Post-Mortem (Root Cause Analysis)\"]\n        RCA --> Live[\"Live Production Deployment (Public Endpoint & Trace)\"]\n    end\n\n    subgraph Authority [\"3. Industry Authority & Career Leverage\"]\n        Live --> Defense[\"Whiteboard Architecture Defense (Staff/Lead Standard)\"]\n        Defense --> Impact[\"Executive Value Translation ($/Token & Risk Reduction)\"]\n    end\n\n    classDef default fill:#1e293b,stroke:#6366f1,stroke-width:1.5px,color:#f8fafc;\n    classDef highlight fill:#312e81,stroke:#818cf8,stroke-width:2px,color:#ffffff;\n    class Readme,RCA,Defense highlight;\n```\n\n---\n\n## 10.2 The Four Tier-1 Artifacts to Build and Publish\n\nTo establish undeniable technical authority, your public GitHub profile must feature four interconnected, non-trivial engineering repositories:\n\n```mermaid\nflowchart LR\n    A1[\"<b>Artifact 1:</b><br/>Bare-Metal Transformer & Tokenizer<br/><i>(PyTorch + RoPE from Scratch)</i>\"]\n    --> A2[\"<b>Artifact 2:</b><br/>Domain QLoRA Adapter Engine<br/><i>(NF4 + Pydantic Schema Enforcement)</i>\"]\n    --> A3[\"<b>Artifact 3:</b><br/>Hybrid Vector/Sparse Retrieval Engine<br/><i>(pgvector HNSW + BM25 + RRF)</i>\"]\n    --> A4[\"<b>Artifact 4:</b><br/>Autonomous Financial Auditor<br/><i>(LangGraph + Evals + EU AI Act)</i>\"]\n\n    classDef default fill:#1e293b,stroke:#6366f1,stroke-width:1.5px,color:#f8fafc;\n    classDef capstone fill:#065f46,stroke:#10b981,stroke-width:2px,color:#ffffff;\n    class A4 capstone;\n```\n\n### Artifact 1: Bare-Metal Transformer & Tokenizer from Scratch\n- **Core Technology:** Raw PyTorch, NumPy, Python standard library (zero `transformers` or `tiktoken` dependencies during core implementation).\n- **Key Deliverables:**\n  - Custom Byte-Pair Encoding (BPE) tokenizer training engine with UTF-8 byte spectrum support.\n  - Custom `RotaryEmbedding` (RoPE) layer applying 2D complex coordinate rotations.\n  - Custom `GroupedQueryAttention` (GQA) block with causal masking and head variance preservation ($\\frac{1}{\\sqrt{d_k}}$).\n  - Forward autoregressive generation loop with KV caching.\n- **Benchmark Included:** Latency and memory comparison against PyTorch's native `nn.TransformerDecoder`.\n\n### Artifact 2: Domain QLoRA Adapter & Schema Enforcement Engine\n- **Core Technology:** PyTorch, bitsandbytes, PEFT, Hugging Face `transformers`, Pydantic v2.\n- **Key Deliverables:**\n  - Custom `LoRALinear` layer implementation: freezing base weights $W_0$, initializing low-rank matrices $A \\sim \\mathcal{N}(0, \\sigma^2)$ and $B = 0$, applying scaling factor $\\frac{\\alpha}{r}$.\n  - Fine-tuning an open-source 8B model (LLaMA-3 or Mistral) on a single consumer GPU (24GB VRAM) to output complex nested financial or medical JSON schemas.\n  - Zero-latency weight merging script ($W_{\\text{prod}} = W_0 + \\frac{\\alpha}{r}BA$) with precision regression tests.\n- **Benchmark Included:** Schema validation pass rate ($100\\%$ over 500 test cases) and token perplexity comparison.\n\n### Artifact 3: Production Hybrid Vector/Sparse Retrieval Engine\n- **Core Technology:** PostgreSQL, `pgvector`, `pg_search` / GIN indexes, BGE-M3, FlagEmbedding.\n- **Key Deliverables:**\n  - Document ingestion ETL with semantic window chunking and markdown AST breadcrumb headers.\n  - Dual-engine index configuration: HNSW vector index ($m=16, ef=64$) alongside inverted GIN BM25 full-text index.\n  - Reciprocal Rank Fusion (RRF with $k=60$) combining dense and lexical candidate lists.\n  - Cross-Encoder reranking pipeline with P95 latency capped below 350ms.\n- **Benchmark Included:** Mean Reciprocal Rank (MRR@10) and Normalized Discounted Cumulative Gain (NDCG@10) comparing Dense-only, Sparse-only, and Hybrid RRF.\n\n### Artifact 4: Enterprise Capstone \u2014 The Autonomous Risk & Compliance Auditor\n- **Core Technology:** LangGraph, PostgreSQL (State Checkpointing), Pydantic v2, vLLM / Ollama, OpenTelemetry, Ragas.\n- **Key Deliverables:**\n  - Cyclic state graph containing Supervisor, Tool Executor, and NLI Evaluator nodes.\n  - Sandboxed deterministic scalar math tools ensuring zero hallucinated calculations.\n  - Human-in-the-Loop (HITL) gate pausing execution upon detecting policy breaches.\n  - Complete telemetry suite tracking token cost attribution, TTFT/ITL latency, and vector drift (PSI).\n  - EU AI Act Article 12\u201314 compliance documentation file.\n- **Benchmark Included:** Automated regression test suite enforcing Groundedness $\\ge 0.95$ under 30 concurrent user simulations.\n\n---\n\n## 10.3 The Gold-Standard Engineering README Blueprint\n\nAn elite repository README is not a casual setup guide; it is an architectural whitepaper that proves systems competence in under 90 seconds.\n\n### The Required 6-Section Structure:\n\n```markdown\n# Autonomous Financial Risk & Compliance Auditor (AFR-Auditor)\n\n[![CI/CD Eval Suite](https://github.com/username/repo/actions/workflows/evals.yml/badge.svg)](https://github.com)\n[![Groundedness SLA](https://img.shields.io/badge/Groundedness_SLA-\u22650.95-emerald.svg)](https://github.com)\n[![EU AI Act Compliant](https://img.shields.io/badge/EU_AI_Act-Article_14_Audited-blue.svg)](https://github.com)\n[![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](https://opensource.org/licenses/MIT)\n\n> A production-grade multi-agent compliance auditor processing unstructured 10-K/10-Q filings, \n> detecting financial variances via deterministic sandboxed tools, and enforcing human-in-the-loop \n> authorization before remediation brief dispatch.\n\n---\n\n## 1. System Architecture\n\n```mermaid\nflowchart TD\n    Ingest[Unstructured SEC Filings] --> Hybrid[Hybrid HNSW + BM25 Search]\n    Hybrid --> RRF[RRF Fusion k=60]\n    RRF --> Rerank[Cross-Encoder BGE-v2]\n    Rerank --> Graph[LangGraph State Machine]\n    Graph --> Tools[Deterministic Tool Sandbox]\n    Tools --> Eval{NLI Groundedness \u2265 0.95}\n    Eval -->|Breach Detected| HITL[Human-in-the-Loop Approval]\n    Eval -->|Failed Eval| Graph\n    HITL --> Dispatch[Signed Remediation Brief]\n```\n\n## 2. Hardware Roofline & Latency Benchmarks\n\nEvaluated on 1x NVIDIA RTX 4090 (24GB VRAM) serving LLaMA-3 8B (AWQ 4-bit) via vLLM:\n\n| Metric | Target SLA | Measured P50 | Measured P95 | Measured P99 |\n|---|---|---|---|---|\n| **Time-To-First-Token (TTFT)** | < 400ms | 185ms | 240ms | 310ms |\n| **Inter-Token Latency (ITL)** | < 30ms | 14ms | 18ms | 22ms |\n| **Cross-Encoder Rerank (Top-25)** | < 350ms | 120ms | 195ms | 260ms |\n| **Full Pipeline E2E Latency** | < 2.5s | 1.42s | 1.88s | 2.15s |\n| **Peak VRAM (Weights + KV Cache)** | < 20 GB | 14.2 GB | 16.8 GB | 18.1 GB |\n\n## 3. Automated Continuous Evaluation (CI/CD)\n\nEvery pull request executes an automated evaluation pass over 50 gold-standard audit scenarios:\n- **Faithfulness / Groundedness (Ragas):** 0.978 (SLA Threshold: \u2265 0.95)\n- **Answer Relevance:** 0.942 (SLA Threshold: \u2265 0.90)\n- **Context Recall:** 0.961 (SLA Threshold: \u2265 0.90)\n- **Schema Validation Rate:** 100% (Strict Pydantic JSON enforcement)\n\n## 4. Production Failure Post-Mortem (Incident RCA-04)\n\nSee `/docs/incidents/RCA-04-kv-cache-thrashing.md` for our deep-dive into how we diagnosed \nand resolved a 90% throughput drop caused by non-contiguous KV-cache memory allocation.\n\n## 5. Quickstart & Local Reproduction\n\n```bash\ngit clone https://github.com/username/afr-auditor.git\ncd afr-auditor\ndocker compose up -d\npython3 -m scripts.run_audit --ticker \"AAPL\" --fiscal-quarter \"2026-Q3\"\n```\n```\n\n---\n\n## 10.4 The Technical Incident Post-Mortem: Proving Seniority Through Failure\n\nJunior developers pretend their systems never fail. Senior and Staff engineers are defined by **how systematically they diagnose, remediate, and architecturally prevent catastrophic failures**.\n\nIncluding one detailed **Root Cause Analysis (RCA)** in your portfolio demonstrates operational maturity that instantly separates you from 99% of applicants.\n\n```mermaid\nflowchart TD\n    Alert[\"\ud83d\udea8 Incident Trigger: 92% Drop in Generation Throughput under Traffic Spike\"]\n    --> S1[\"Phase 1: Triage & Metrics Collection<br/>\u2022 GPU Kernel Utilization: 12%<br/>\u2022 PCIe Bus Transfer Bandwidth: Saturated (99%)<br/>\u2022 VRAM Free: 4.2 GB\"]\n    --> S2[\"Phase 2: The 5-Whys Diagnostic Chain<br/>\u2022 Why did throughput collapse? Cores waiting on memory transfers.<br/>\u2022 Why were transfers happening? KV pages swapping to CPU host RAM.<br/>\u2022 Why were pages swapping? Engine exceeded physical block budget.\"]\n    --> S3[\"Phase 3: Architectural Remediation<br/>\u2022 Deploy Preemptive Request Eviction (pause lowest-progress sequence).<br/>\u2022 Enable Token Bucket Rate Limiting at API Gateway.<br/>\u2022 Enforce FP8 KV-Cache Quantization (halving memory per token).\"]\n    --> S4[\"\u2705 Verification & Preventative Audit<br/>\u2022 Load test sustained 60 concurrent streams without CPU swapping.<br/>\u2022 OpenTelemetry alert set on free KV blocks < 5%.\"]\n\n    classDef default fill:#1e293b,stroke:#6366f1,stroke-width:1.5px,color:#f8fafc;\n    classDef alert fill:#881337,stroke:#f43f5e,stroke-width:2px,color:#ffe4e6;\n    classDef success fill:#065f46,stroke:#10b981,stroke-width:2px,color:#ffffff;\n    class Alert alert;\n    class S4 success;\n```\n\n### The Production Incident Template:\n\n```markdown\n# INCIDENT RCA-04: Autoregressive KV-Cache Thrashing Under Concurrent Traffic Spikes\n\n**Date:** 2026-09-14  \n**Severity:** SEV-1 (Production Throughput Degradation)  \n**Author:** AI Systems Engineering Team  \n\n### 1. Executive Summary\nDuring a simulated quarter-end compliance audit load test, the serving cluster experienced \na 92% collapse in generation throughput (dropping from 450 tokens/sec to 34 tokens/sec) when \nconcurrent requests scaled from 10 to 35. No error logs were thrown, but P99 latency breached \nService Level Agreements (SLAs), climbing from 1.8s to 24.5s.\n\n### 2. Root Cause Analysis (The 5-Whys)\n1. **Why was latency spiking?** GPU Tensor Cores spent 88% of execution time idle waiting on data.\n2. **Why was data transfer slow?** The system was thrashing memory across PCIe Gen4 lanes.\n3. **Why was data moving over PCIe?** The serving runtime was swapping KV-cache blocks out of \n   GPU VRAM into CPU host RAM.\n4. **Why did it swap?** Total active tokens across 35 requests exceeded physical GPU VRAM allocations.\n5. **Why was memory exhausted?** The runtime pre-allocated contiguous memory blocks based on \n   the maximum theoretical context (32K tokens) rather than dynamic token usage, fragmenting 68% of VRAM.\n\n### 3. Immediate Remediation\n- Replaced naive static memory allocation with **PagedAttention** (vLLM engine), breaking KV caches \n  into small 16-token non-contiguous physical blocks mapped via page tables.\n- Down-cast the KV cache precision from native `BF16` (2 bytes/token) to `FP8` (1 byte/token).\n- Configured a token-bucket rate limiter at the API gateway layer rejecting requests when free \n  KV memory blocks drop below 5%.\n\n### 4. Verification & Hardening\n- Re-ran load test with 60 concurrent streaming users. Throughput remained stable at 410 tokens/sec \n  with zero PCIe page swapping and zero CUDA OOM errors.\n- Added OpenTelemetry Prometheus metric `vllm_gpu_cache_usage_factor` with automated PagerDuty alert \n  triggering at 90% utilization.\n```\n\n---\n\n## 10.5 The Product-Engineering Bridge: Translating Math to C-Suite Value\n\nA true Senior AI Engineer does not speak purely in FLOPs, loss curves, and RoPE frequencies when presenting to business stakeholders. You must translate technical decisions into **risk reduction, infrastructure cost efficiency, and enterprise ROI**:\n\n| Technical Architectural Decision | Low-Level Engineering Term | Executive / C-Suite Financial Translation |\n|---|---|---|\n| **PagedAttention & Continuous Batching** | \"Optimized KV cache fragmentation to <4% and dynamic iteration scheduling.\" | **\"Cut our GPU hosting         resetBtn.onclick = initAuditState;
        caseSelect.onchange = initAuditState;

        initAuditState();
      }

      if (chapterId === 'ch-09') {
        // Fast-Track 60-Day Sprint Calculator
        const widget = document.createElement('div');
        widget.className = 'mt-8 p-5 rounded-2xl bg-gradient-to-br from-emerald-950/50 to-slate-900 border border-emerald-500/30 text-gray-200 shadow-xl';
        widget.innerHTML = `
          <div class="flex items-center gap-2 mb-3">
            <span class="p-1.5 rounded-lg bg-emerald-500/20 text-emerald-400"><i data-lucide="zap" class="w-5 h-5"></i></span>
            <h4 class="font-bold text-base text-white">Interactive Accelerated Timeline Calculator</h4>
          </div>
          <p class="text-xs text-gray-400 mb-4">Calculate how fast you will transition from beginner to industry-ready AI engineer by dialing your daily deliberate practice.</p>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div>
              <label class="block font-semibold mb-1 text-gray-300">Daily Deliberate Practice: <span id="sprint-hours-val" class="text-emerald-400 font-bold">2 Hours</span>/day</label>
              <input type="range" id="sprint-hours" min="1" max="6" step="0.5" value="2" class="w-full accent-emerald-500">
            </div>
            <div>
              <label class="block font-semibold mb-1 text-gray-300">Pace Mode:</label>
              <select id="sprint-mode" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
                <option value="60">Hyper-Sprint (60 Days / 8 Weeks)</option>
                <option value="90">Focused Fast-Track (90 Days / 12 Weeks)</option>
                <option value="180">Standard Pace (180 Days / 6 Months)</option>
              </select>
            </div>
          </div>

          <div class="mt-5 p-4 rounded-xl bg-black/40 border border-gray-800 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">Total Deliberate Hours</div>
              <div id="sprint-total-hours" class="text-xl font-extrabold text-white mt-0.5">120 Hours</div>
            </div>
            <div>
              <div class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">Target Industry Readiness Date</div>
              <div id="sprint-target-date" class="text-xl font-extrabold text-emerald-400 mt-0.5">In ~8 Weeks</div>
            </div>
            <div class="text-xs text-gray-400">
              Protocol: <strong>30m</strong> paper read · <strong>60m</strong> code · <strong>30m</strong> git commit
            </div>
          </div>
        `;
        bodyEl.appendChild(widget);

        const hoursInput = widget.querySelector('#sprint-hours');
        const modeSelect = widget.querySelector('#sprint-mode');

        function recalcSprint() {
          const hours = parseFloat(hoursInput.value);
          const days = parseInt(modeSelect.value);
          widget.querySelector('#sprint-hours-val').innerText = hours + ' Hours';

          const totalHours = Math.round(hours * days);
          const weeks = Math.round(days / 7);

          const target = new Date();
          target.setDate(target.getDate() + days);
          const options = { month: 'short', day: 'numeric', year: 'numeric' };

          widget.querySelector('#sprint-total-hours').innerText = totalHours + ' Hours';
          widget.querySelector('#sprint-target-date').innerText = target.toLocaleDateString(undefined, options) + ` (~${weeks} wks)`;
        }

        hoursInput.oninput = recalcSprint;
        modeSelect.onchange = recalcSprint;
        recalcSprint();
      }
      if (chapterId === 'ch-10') {
        // Interactive Portfolio Readiness & Authority Scorecard
        const widget = document.createElement('div');
        widget.className = 'mt-8 p-5 rounded-2xl bg-gradient-to-br from-amber-950/40 via-slate-900 to-indigo-950/40 border border-amber-500/30 text-gray-200 shadow-xl';
        widget.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="p-1.5 rounded-lg bg-amber-500/20 text-amber-400"><i data-lucide="award" class="w-5 h-5"></i></span>
              <h4 class="font-bold text-base text-white">Interactive Proof-of-Work Portfolio Auditor</h4>
            </div>
            <span id="score-tier-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30">Auditing...</span>
          </div>
          <p class="text-xs text-gray-400 mb-4">Audit your public engineering artifacts against the 8 production criteria expected by Senior & Staff AI Architect technical interviewers.</p>

          <!-- Checklist Grid -->
          <div class="space-y-2 mb-5 text-xs" id="portfolio-checklist">
            <label class="flex items-start gap-2.5 p-2.5 rounded-xl bg-gray-900/80 border border-gray-800 hover:border-gray-700 cursor-pointer transition select-none">
              <input type="checkbox" class="port-item mt-0.5 accent-amber-500 w-4 h-4 rounded" checked>
              <div>
                <span class="font-semibold text-white">1. Bare-Metal Substrate from Scratch</span>
                <p class="text-[11px] text-gray-400">Custom BPE tokenizer + RoPE self-attention decoder block coded in raw PyTorch without black-box wrappers.</p>
              </div>
            </label>
            <label class="flex items-start gap-2.5 p-2.5 rounded-xl bg-gray-900/80 border border-gray-800 hover:border-gray-700 cursor-pointer transition select-none">
              <input type="checkbox" class="port-item mt-0.5 accent-amber-500 w-4 h-4 rounded" checked>
              <div>
                <span class="font-semibold text-white">2. Domain QLoRA Adapter & Schema Engine</span>
                <p class="text-[11px] text-gray-400">8B model fine-tuned on 1 GPU with NF4 quantization, strict Pydantic JSON validation, and zero-latency weight merge.</p>
              </div>
            </label>
            <label class="flex items-start gap-2.5 p-2.5 rounded-xl bg-gray-900/80 border border-gray-800 hover:border-gray-700 cursor-pointer transition select-none">
              <input type="checkbox" class="port-item mt-0.5 accent-amber-500 w-4 h-4 rounded" checked>
              <div>
                <span class="font-semibold text-white">3. Hybrid Retrieval & Reranking Substrate</span>
                <p class="text-[11px] text-gray-400">Dual pgvector HNSW (dense) + PostgreSQL GIN (BM25 sparse) fused via RRF (k=60) with Cross-Encoder latency budget.</p>
              </div>
            </label>
            <label class="flex items-start gap-2.5 p-2.5 rounded-xl bg-gray-900/80 border border-gray-800 hover:border-gray-700 cursor-pointer transition select-none">
              <input type="checkbox" class="port-item mt-0.5 accent-amber-500 w-4 h-4 rounded" checked>
              <div>
                <span class="font-semibold text-white">4. Stateful Cyclic Agent Graph</span>
                <p class="text-[11px] text-gray-400">LangGraph cyclic state machine with deterministic tools, PostgreSQL checkpoint persistence, and human-in-the-loop gate.</p>
              </div>
            </label>
            <label class="flex items-start gap-2.5 p-2.5 rounded-xl bg-gray-900/80 border border-gray-800 hover:border-gray-700 cursor-pointer transition select-none">
              <input type="checkbox" class="port-item mt-0.5 accent-amber-500 w-4 h-4 rounded" checked>
              <div>
                <span class="font-semibold text-white">5. High-Throughput Serving & Roofline Sizing</span>
                <p class="text-[11px] text-gray-400">vLLM PagedAttention deployment benchmarked with static weight footprint vs dynamic KV-cache concurrency headroom.</p>
              </div>
            </label>
            <label class="flex items-start gap-2.5 p-2.5 rounded-xl bg-gray-900/80 border border-gray-800 hover:border-gray-700 cursor-pointer transition select-none">
              <input type="checkbox" class="port-item mt-0.5 accent-amber-500 w-4 h-4 rounded">
              <div>
                <span class="font-semibold text-white">6. Automated Continuous Evals in CI/CD</span>
                <p class="text-[11px] text-gray-400">Ragas RAG Triad test suite asserting Faithfulness ≥ 0.95 and Context Recall ≥ 0.90 on every git pull request.</p>
              </div>
            </label>
            <label class="flex items-start gap-2.5 p-2.5 rounded-xl bg-gray-900/80 border border-gray-800 hover:border-gray-700 cursor-pointer transition select-none">
              <input type="checkbox" class="port-item mt-0.5 accent-amber-500 w-4 h-4 rounded">
              <div>
                <span class="font-semibold text-white">7. Technical Incident Post-Mortem (5-Whys RCA)</span>
                <p class="text-[11px] text-gray-400">Published post-mortem deep dive into a real failure (e.g., KV page thrashing or semantic vector drift) and architectural fix.</p>
              </div>
            </label>
            <label class="flex items-start gap-2.5 p-2.5 rounded-xl bg-gray-900/80 border border-gray-800 hover:border-gray-700 cursor-pointer transition select-none">
              <input type="checkbox" class="port-item mt-0.5 accent-amber-500 w-4 h-4 rounded">
              <div>
                <span class="font-semibold text-white">8. Live Production Deployment & Tracing</span>
                <p class="text-[11px] text-gray-400">Publicly accessible production endpoint with OpenTelemetry tracing spans tracking TTFT, ITL, and USD token costs.</p>
              </div>
            </label>
          </div>

          <!-- Score Summary Box -->
          <div class="p-4 rounded-xl bg-black/40 border border-gray-800 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Industry Authority Score</div>
              <div id="authority-score-val" class="text-2xl font-extrabold text-amber-400 mt-0.5">62.5%</div>
            </div>
            <div>
              <div class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Market Positioning</div>
              <div id="authority-tier-desc" class="text-sm font-bold text-white mt-0.5">Mid-Level AI Engineer</div>
            </div>
            <div id="authority-recommendation" class="text-xs text-gray-400 max-w-xs">
              Complete automated CI/CD evals and publish 1 incident post-mortem to unlock Senior Architect tier.
            </div>
          </div>
        `;
        bodyEl.appendChild(widget);

        const checkboxes = widget.querySelectorAll('.port-item');
        const scoreVal = widget.querySelector('#authority-score-val');
        const tierBadge = widget.querySelector('#score-tier-badge');
        const tierDesc = widget.querySelector('#authority-tier-desc');
        const recText = widget.querySelector('#authority-recommendation');

        function updateScore() {
          const total = checkboxes.length;
          const checked = Array.from(checkboxes).filter(cb => cb.checked).length;
          const pct = Math.round((checked / total) * 100);

          scoreVal.innerText = `${pct}% (${checked}/${total})`;

          if (pct >= 88) {
            tierBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
            tierBadge.innerText = 'Staff / Principal AI Tier';
            tierDesc.className = 'text-sm font-bold text-emerald-400 mt-0.5';
            tierDesc.innerText = 'Staff / Lead AI Systems Architect';
            recText.innerText = 'Elite Proof-of-Work: Fully qualified for top-tier AI systems architect & lead engineering roles.';
          } else if (pct >= 63) {
            tierBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30';
            tierBadge.innerText = 'Senior AI Engineer Tier';
            tierDesc.className = 'text-sm font-bold text-blue-400 mt-0.5';
            tierDesc.innerText = 'Senior Production AI Engineer';
            recText.innerText = 'Production-ready: Add automated CI/CD evals and publish 1 failure post-mortem to unlock Staff tier.';
          } else if (pct >= 38) {
            tierBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30';
            tierBadge.innerText = 'Mid-Level AI Tier';
            tierDesc.className = 'text-sm font-bold text-amber-400 mt-0.5';
            tierDesc.innerText = 'Mid-Level AI Developer';
            recText.innerText = 'Building momentum: Implement stateful agent graphs and serving engine sizing to reach Senior status.';
          } else {
            tierBadge.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30';
            tierBadge.innerText = 'Junior / Tutorial Tier';
            tierDesc.className = 'text-sm font-bold text-rose-400 mt-0.5';
            tierDesc.innerText = 'Junior Prompt / Wrapper Developer';
            recText.innerText = 'High rejection risk: Replace black-box wrappers with bare-metal PyTorch and hybrid retrieval.';
          }
          if (window.lucide) lucide.createIcons();
        }

        checkboxes.forEach(cb => cb.onchange = updateScore);
        updateScore();
      }

    }


    function updateDoneButton() {
      const isDone = completedChapters.includes(CHAPTERS[currentIdx].id);
      if (isDone) {
        markBtn.classList.add('bg-emerald-500/20', 'border-emerald-500');
        markBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Completed';
        chapterStatusPill.className = 'px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-400 border border-emerald-500/30';
        chapterStatusPill.innerText = 'Completed';
      } else {
        markBtn.classList.remove('bg-emerald-500/20', 'border-emerald-500');
        markBtn.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4"></i> Mark Done';
        chapterStatusPill.className = 'px-2 py-0.5 rounded-full text-[11px] font-medium bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300';
        chapterStatusPill.innerText = 'In Progress';
      }
      lucide.createIcons();
    }

    function toggleDrawer(open) {
      if (open) {
        drawerOverlay.classList.remove('hidden');
        setTimeout(() => drawerOverlay.classList.remove('opacity-0'), 10);
        drawer.classList.remove('-translate-x-full');
      } else {
        drawerOverlay.classList.add('opacity-0');
        drawer.classList.add('-translate-x-full');
        setTimeout(() => drawerOverlay.classList.add('hidden'), 300);
      }
    }

    function applyFontSize() {
      bodyEl.style.fontSize = `${currentFontSize}px`;
    }

    // Scroll Reading Progress Indicator
    window.addEventListener('scroll', () => {
      const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
      if (totalHeight > 0) {
        const progress = (window.scrollY / totalHeight) * 100;
        scrollProgress.style.width = `${Math.min(100, Math.max(0, progress))}%`;
      }
    });

    // Event Listeners
    document.getElementById('menu-btn').onclick = () => toggleDrawer(true);
    document.getElementById('drawer-close').onclick = () => toggleDrawer(false);
    drawerOverlay.onclick = () => toggleDrawer(false);

    prevBtn.onclick = () => {
      if (currentIdx > 0) loadChapter(currentIdx - 1);
    };

    nextBtn.onclick = () => {
      if (currentIdx < CHAPTERS.length - 1) loadChapter(currentIdx + 1);
    };

    markBtn.onclick = () => {
      const id = CHAPTERS[currentIdx].id;
      if (completedChapters.includes(id)) {
        completedChapters = completedChapters.filter(x => x !== id);
      } else {
        completedChapters.push(id);
      }
      localStorage.setItem('ai_completed_chapters', JSON.stringify(completedChapters));
      updateDoneButton();
      renderChapterList(searchInput.value);
    };

    document.getElementById('font-btn').onclick = () => {
      currentFontSize = currentFontSize >= 21 ? 15 : currentFontSize + 1;
      localStorage.setItem('ai_font_size', currentFontSize);
      applyFontSize();
    };

    document.getElementById('theme-btn').onclick = () => {
      isDarkMode = !isDarkMode;
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('ai_theme', isDarkMode ? 'dark' : 'light');
      themeIcon.setAttribute('data-lucide', isDarkMode ? 'moon' : 'sun');
      loadChapter(currentIdx);
      lucide.createIcons();
    };

    searchInput.addEventListener('input', (e) => {
      renderChapterList(e.target.value);
    });

    // Initialize immediately or once DOM is ready
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>

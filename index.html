    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const markBtn = document.getElementById('mark-btn');
    const scrollProgress = document.getElementById('scroll-progress');
    const searchInput = document.getElementById('search-input');
    const themeIcon = document.getElementById('theme-icon');
    const chapterReadTime = document.getElementById('chapter-read-time');
    const chapterStatusPill = document.getElementById('chapter-status-pill');

    // Initialize Application
    function init() {
      // Setup Theme
      if (!isDarkMode) {
        document.documentElement.classList.remove('dark');
        themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        document.documentElement.classList.add('dark');
        themeIcon.setAttribute('data-lucide', 'moon');
      }

      // Check Saved Progress
      const savedChapter = localStorage.getItem('ai_last_chapter_idx');
      if (savedChapter !== null && CHAPTERS[savedChapter]) {
        currentIdx = parseInt(savedChapter);
      }

      renderChapterList();
      loadChapter(currentIdx);
      applyFontSize();
      lucide.createIcons();

      // Register Service Worker for Offline PWA Support
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(() => {
            const pwaStatus = document.getElementById('pwa-status');
            if (pwaStatus) pwaStatus.innerText = 'PWA Offline Ready';
          })
          .catch((err) => console.log('SW registration note:', err));
      }
    }

    function renderChapterList(filterText = '') {
      chaptersList.innerHTML = '';
      const query = filterText.toLowerCase().trim();

      CHAPTERS.forEach((ch, idx) => {
        if (query && !ch.title.toLowerCase().includes(query) && !ch.summary.toLowerCase().includes(query)) {
          return;
        }

        const isDone = completedChapters.includes(ch.id);
        const isActive = idx === currentIdx;
        const item = document.createElement('button');
        item.className = `w-full text-left p-3 rounded-xl flex items-center justify-between text-sm transition-all ${
          isActive 
            ? 'bg-brand-500/15 dark:bg-brand-600/25 text-brand-600 dark:text-brand-400 font-semibold border border-brand-500/30' 
            : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800/60'
        }`;
        
        item.innerHTML = `
          <div class="flex flex-col pr-2 truncate">
            <span class="truncate font-medium">${ch.title}</span>
            <span class="text-xs text-gray-500 dark:text-gray-400 font-normal truncate mt-0.5">${ch.summary}</span>
          </div>
          ${isDone ? '<i data-lucide="check" class="w-4 h-4 text-emerald-500 flex-shrink-0"></i>' : ''}
        `;

        item.onclick = () => {
          loadChapter(idx);
          toggleDrawer(false);
        };
        chaptersList.appendChild(item);
      });

      completedCount.innerText = `${completedChapters.length}/${CHAPTERS.length} Done`;
      lucide.createIcons();
    }

        function loadChapter(idx) {
      try {
        currentIdx = idx;
        localStorage.setItem('ai_last_chapter_idx', idx);
        const ch = CHAPTERS[idx];

        chapterPill.innerText = `Chapter ${idx + 1} of ${CHAPTERS.length}`;
        navTitle.innerText = ch.title;
        
        // Calculate reading time
        const wordCount = (ch.markdown || '').split(/\s+/).length;
        const readMinutes = Math.max(1, Math.ceil(wordCount / 200));
        chapterReadTime.innerHTML = `<i data-lucide="clock" class="w-3.5 h-3.5"></i> ${readMinutes} min read (${wordCount} words)`;

        // Render Markdown safely
        if (typeof marked !== 'undefined' && marked.parse) {
          bodyEl.innerHTML = marked.parse(ch.markdown);
        } else {
          bodyEl.innerHTML = `<div class="prose dark:prose-invert"><pre class="whitespace-pre-wrap font-sans text-sm">${ch.markdown}</pre></div>`;
        }

        // Render KaTeX Math Equations safely
        if (window.renderMathInElement) {
          try {
            renderMathInElement(bodyEl, {
              delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '$', right: '$', display: false}
              ],
              throwOnError: false
            });
          } catch (mErr) {
            console.warn('KaTeX render note:', mErr);
          }
        }

        // Add Copy Buttons to Code Blocks
        bodyEl.querySelectorAll('pre').forEach((pre) => {
          if (pre.querySelector('.copy-code-btn')) return;
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-code-btn';
          copyBtn.innerHTML = '<i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy';
          copyBtn.onclick = () => {
            const code = pre.querySelector('code')?.innerText || pre.innerText;
            navigator.clipboard.writeText(code).then(() => {
              copyBtn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i> Copied';
              setTimeout(() => {
                copyBtn.innerHTML = '<i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy';
                if (window.lucide) lucide.createIcons();
              }, 2000);
            });
          };
          pre.appendChild(copyBtn);
        });

        // Inject Interactive Simulators for relevant chapters
        injectChapterWidgets(ch.id);

        // Update Navigation Buttons
        prevBtn.disabled = idx === 0;
        prevBtn.style.opacity = idx === 0 ? '0.4' : '1';
        prevBtn.style.pointerEvents = idx === 0 ? 'none' : 'auto';

        nextBtn.disabled = idx === CHAPTERS.length - 1;
        nextBtn.style.opacity = idx === CHAPTERS.length - 1 ? '0.4' : '1';
        nextBtn.style.pointerEvents = idx === CHAPTERS.length - 1 ? 'none' : 'auto';

        updateDoneButton();
        renderChapterList(searchInput ? searchInput.value : '');
        if (window.lucide) lucide.createIcons();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        console.error('Error loading chapter:', err);
        bodyEl.innerHTML = `<div class="p-6 bg-red-950/40 border border-red-500/50 rounded-xl text-red-200">
          <h3 class="font-bold text-base mb-2">Error Displaying Chapter</h3>
          <p class="text-sm font-mono">${err.message}</p>
          <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold">Reload Application</button>
        </div>`;
      }
    }

    // Interactive Simulators for Beginner-to-Expert Intuition
    function injectChapterWidgets(chapterId) {
      if (chapterId === 'ch-02') {
        // KV Cache Sizing Simulator
        const widget = document.createElement('div');
        widget.className = 'mt-8 p-5 rounded-2xl bg-gradient-to-br from-indigo-950/50 to-slate-900 border border-indigo-500/30 text-gray-200 shadow-xl';
        widget.innerHTML = `
          <div class="flex items-center gap-2 mb-3">
            <span class="p-1.5 rounded-lg bg-brand-500/20 text-brand-400"><i data-lucide="cpu" class="w-5 h-5"></i></span>
            <h4 class="font-bold text-base text-white">Interactive KV-Cache & VRAM Sizer Simulator</h4>
          </div>
          <p class="text-xs text-gray-400 mb-4">Slide the parameters below to see how context length and concurrency create the "Memory Wall" in production LLM inference.</p>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div>
              <label class="block font-semibold mb-1 text-gray-300">Context Length: <span id="vram-seq-val" class="text-brand-400 font-bold">32,768</span> tokens</label>
              <input type="range" id="vram-seq" min="2048" max="131072" step="2048" value="32768" class="w-full accent-brand-500">
            </div>
            <div>
              <label class="block font-semibold mb-1 text-gray-300">Concurrent Requests (Batch Size): <span id="vram-batch-val" class="text-brand-400 font-bold">8</span></label>
              <input type="range" id="vram-batch" min="1" max="64" step="1" value="8" class="w-full accent-brand-500">
            </div>
            <div>
              <label class="block font-semibold mb-1 text-gray-300">Attention Head Architecture:</label>
              <select id="vram-arch" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
                <option value="gqa">Grouped-Query Attention (GQA - 8 KV Heads) [LLaMA-3]</option>
                <option value="mha">Multi-Head Attention (MHA - 64 KV Heads) [GPT-3]</option>
                <option value="mqa">Multi-Query Attention (MQA - 1 KV Head)</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold mb-1 text-gray-300">Precision:</label>
              <select id="vram-prec" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
                <option value="2">BF16 / FP16 (2 Bytes per param)</option>
                <option value="1">FP8 (1 Byte per param)</option>
              </select>
            </div>
          </div>

          <div class="mt-5 p-4 rounded-xl bg-black/40 border border-gray-800 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">Per-Token KV Footprint</div>
              <div id="vram-per-token" class="text-lg font-extrabold text-white mt-0.5">320 KB</div>
            </div>
            <div>
              <div class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">Total KV Cache VRAM Required</div>
              <div id="vram-total" class="text-2xl font-black text-brand-400 mt-0.5">81.92 GB</div>
            </div>
            <div id="vram-gpu-recommendation" class="text-xs px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/30">
              Requires 2x 80GB H100 GPUs for KV-Cache alone!
            </div>
          </div>
        `;
        bodyEl.appendChild(widget);

        // Wire simulator reactivity
        const seqInput = widget.querySelector('#vram-seq');
        const batchInput = widget.querySelector('#vram-batch');
        const archSelect = widget.querySelector('#vram-arch');
        const precSelect = widget.querySelector('#vram-prec');

        function recalcVram() {
          const seq = parseInt(seqInput.value);
          const batch = parseInt(batchInput.value);
          const prec = parseInt(precSelect.value);
          const arch = archSelect.value;
          
          widget.querySelector('#vram-seq-val').innerText = seq.toLocaleString();
          widget.querySelector('#vram-batch-val').innerText = batch;

          const nLayers = 80;
          const dHead = 128;
          let kvHeads = 8;
          if (arch === 'mha') kvHeads = 64;
          if (arch === 'mqa') kvHeads = 1;

          const bytesPerToken = 2 * prec * nLayers * kvHeads * dHead;
          const totalBytes = bytesPerToken * seq * batch;
          const totalGB = totalBytes / (1024 * 1024 * 1024);

          widget.querySelector('#vram-per-token').innerText = (bytesPerToken / 1024).toFixed(1) + ' KB';
          widget.querySelector('#vram-total').innerText = totalGB.toFixed(2) + ' GB';

          const recEl = widget.querySelector('#vram-gpu-recommendation');
          if (totalGB < 16) {
            recEl.className = 'text-xs px-3 py-1.5 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
            recEl.innerText = 'Fits inside a single consumer 24GB GPU (RTX 4090 / A10G)';
          } else if (totalGB < 80) {
            recEl.className = 'text-xs px-3 py-1.5 rounded-lg bg-blue-500/20 text-blue-300 border border-blue-500/30';
            recEl.innerText = 'Fits on 1x 80GB A100/H100 GPU';
          } else if (totalGB < 320) {
            recEl.className = 'text-xs px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-300 border border-amber-500/30';
            recEl.innerText = `Requires ${Math.ceil(totalGB / 80)}x 80GB H100 GPUs for KV-Cache alone!`;
          } else {
            recEl.className = 'text-xs px-3 py-1.5 rounded-lg bg-red-500/20 text-red-300 border border-red-500/30';
            recEl.innerText = `Extreme Memory Wall: ${Math.ceil(totalGB / 80)}x 80GB GPUs needed! Must use PagedAttention / vLLM.`;
          }
        }

        seqInput.oninput = recalcVram;
        batchInput.oninput = recalcVram;
        archSelect.onchange = recalcVram;
        precSelect.onchange = recalcVram;
        recalcVram();
      }

      if (chapterId === 'ch-03') {
        // LoRA vs Full Fine-Tuning Savings Calculator
        const widget = document.createElement('div');
        widget.className = 'mt-8 p-5 rounded-2xl bg-gradient-to-br from-purple-950/50 to-slate-900 border border-purple-500/30 text-gray-200 shadow-xl';
        widget.innerHTML = `
          <div class="flex items-center gap-2 mb-3">
            <span class="p-1.5 rounded-lg bg-purple-500/20 text-purple-400"><i data-lucide="sliders" class="w-5 h-5"></i></span>
            <h4 class="font-bold text-base text-white">Interactive LoRA vs. Full Fine-Tuning Estimator</h4>
          </div>
          <p class="text-xs text-gray-400 mb-4">Compare memory overhead and trainable parameter counts to understand why LoRA/QLoRA democratized fine-tuning.</p>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div>
              <label class="block font-semibold mb-1 text-gray-300">Base Model Size:</label>
              <select id="lora-model" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
                <option value="7">Llama-3 8B (8 Billion Params)</option>
                <option value="14">Qwen-2.5 14B (14 Billion Params)</option>
                <option value="70">Llama-3 70B (70 Billion Params)</option>
              </select>
            </div>
            <div>
              <label class="block font-semibold mb-1 text-gray-300">LoRA Rank Hyperparameter ($r$):</label>
              <select id="lora-rank" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
                <option value="8">r = 8 (Minimal, high efficiency)</option>
                <option value="16" selected>r = 16 (Industry standard sweet spot)</option>
                <option value="64">r = 64 (High expressivity)</option>
              </select>
            </div>
          </div>

          <div class="mt-5 grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="p-3.5 rounded-xl bg-black/40 border border-gray-800">
              <div class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">Full Fine-Tuning VRAM</div>
              <div id="lora-full-vram" class="text-lg font-extrabold text-red-400 mt-1">128 GB</div>
              <div class="text-[10px] text-gray-500 mt-0.5">16 bytes/param (AdamW + grads)</div>
            </div>
            <div class="p-3.5 rounded-xl bg-black/40 border border-gray-800">
              <div class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">LoRA (16-bit) VRAM</div>
              <div id="lora-lora-vram" class="text-lg font-extrabold text-blue-400 mt-1">18 GB</div>
              <div class="text-[10px] text-gray-500 mt-0.5">Frozen W_0 + tiny adapters</div>
            </div>
            <div class="p-3.5 rounded-xl bg-black/40 border border-purple-500/30 bg-purple-950/20">
              <div class="text-[11px] uppercase tracking-wider text-purple-300 font-semibold">QLoRA (NF4) VRAM</div>
              <div id="lora-qlora-vram" class="text-lg font-extrabold text-emerald-400 mt-1">5.8 GB</div>
              <div class="text-[10px] text-emerald-500/80 mt-0.5">Fits on a single MacBook or laptop!</div>
            </div>
          </div>
        `;
        bodyEl.appendChild(widget);

        const modelSelect = widget.querySelector('#lora-model');
        const rankSelect = widget.querySelector('#lora-rank');

        function recalcLora() {
          const params = parseFloat(modelSelect.value);
          const fullVram = params * 16;
          const loraVram = (params * 2) + 2; // ~2 bytes/param base + 2GB adapter/activation overhead
          const qloraVram = (params * 0.5) + 1.8; // ~0.5 bytes/param 4-bit base + activation overhead

          widget.querySelector('#lora-full-vram').innerText = fullVram.toFixed(0) + ' GB';
          widget.querySelector('#lora-lora-vram').innerText = loraVram.toFixed(1) + ' GB';
          widget.querySelector('#lora-qlora-vram').innerText = qloraVram.toFixed(1) + ' GB';
        }

        modelSelect.onchange = recalcLora;
        rankSelect.onchange = recalcLora;
        recalcLora();
      }

      if (chapterId === 'ch-09') {
        // Fast-Track 60-Day Sprint Calculator
        const widget = document.createElement('div');
        widget.className = 'mt-8 p-5 rounded-2xl bg-gradient-to-br from-emerald-950/50 to-slate-900 border border-emerald-500/30 text-gray-200 shadow-xl';
        widget.innerHTML = `
          <div class="flex items-center gap-2 mb-3">
            <span class="p-1.5 rounded-lg bg-emerald-500/20 text-emerald-400"><i data-lucide="zap" class="w-5 h-5"></i></span>
            <h4 class="font-bold text-base text-white">Interactive Accelerated Timeline Calculator</h4>
          </div>
          <p class="text-xs text-gray-400 mb-4">Calculate how fast you will transition from beginner to industry-ready AI engineer by dialing your daily deliberate practice.</p>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div>
              <label class="block font-semibold mb-1 text-gray-300">Daily Deliberate Practice: <span id="sprint-hours-val" class="text-emerald-400 font-bold">2 Hours</span>/day</label>
              <input type="range" id="sprint-hours" min="1" max="6" step="0.5" value="2" class="w-full accent-emerald-500">
            </div>
            <div>
              <label class="block font-semibold mb-1 text-gray-300">Pace Mode:</label>
              <select id="sprint-mode" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-xs text-white">
                <option value="60">Hyper-Sprint (60 Days / 8 Weeks)</option>
                <option value="90">Focused Fast-Track (90 Days / 12 Weeks)</option>
                <option value="180">Standard Pace (180 Days / 6 Months)</option>
              </select>
            </div>
          </div>

          <div class="mt-5 p-4 rounded-xl bg-black/40 border border-gray-800 flex flex-wrap items-center justify-between gap-4">
            <div>
              <div class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">Total Deliberate Hours</div>
              <div id="sprint-total-hours" class="text-xl font-extrabold text-white mt-0.5">120 Hours</div>
            </div>
            <div>
              <div class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">Target Industry Readiness Date</div>
              <div id="sprint-target-date" class="text-xl font-extrabold text-emerald-400 mt-0.5">In ~8 Weeks</div>
            </div>
            <div class="text-xs text-gray-400">
              Protocol: <strong>30m</strong> paper read · <strong>60m</strong> code · <strong>30m</strong> git commit
            </div>
          </div>
        `;
        bodyEl.appendChild(widget);

        const hoursInput = widget.querySelector('#sprint-hours');
        const modeSelect = widget.querySelector('#sprint-mode');

        function recalcSprint() {
          const hours = parseFloat(hoursInput.value);
          const days = parseInt(modeSelect.value);
          widget.querySelector('#sprint-hours-val').innerText = hours + ' Hours';

          const totalHours = Math.round(hours * days);
          const weeks = Math.round(days / 7);

          const target = new Date();
          target.setDate(target.getDate() + days);
          const options = { month: 'short', day: 'numeric', year: 'numeric' };

          widget.querySelector('#sprint-total-hours').innerText = totalHours + ' Hours';
          widget.querySelector('#sprint-target-date').innerText = target.toLocaleDateString(undefined, options) + ` (~${weeks} wks)`;
        }

        hoursInput.oninput = recalcSprint;
        modeSelect.onchange = recalcSprint;
        recalcSprint();
      }
    }


    function updateDoneButton() {
      const isDone = completedChapters.includes(CHAPTERS[currentIdx].id);
      if (isDone) {
        markBtn.classList.add('bg-emerald-500/20', 'border-emerald-500');
        markBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Completed';
        chapterStatusPill.className = 'px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-400 border border-emerald-500/30';
        chapterStatusPill.innerText = 'Completed';
      } else {
        markBtn.classList.remove('bg-emerald-500/20', 'border-emerald-500');
        markBtn.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4"></i> Mark Done';
        chapterStatusPill.className = 'px-2 py-0.5 rounded-full text-[11px] font-medium bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300';
        chapterStatusPill.innerText = 'In Progress';
      }
      lucide.createIcons();
    }

    function toggleDrawer(open) {
      if (open) {
        drawerOverlay.classList.remove('hidden');
        setTimeout(() => drawerOverlay.classList.remove('opacity-0'), 10);
        drawer.classList.remove('-translate-x-full');
      } else {
        drawerOverlay.classList.add('opacity-0');
        drawer.classList.add('-translate-x-full');
        setTimeout(() => drawerOverlay.classList.add('hidden'), 300);
      }
    }

    function applyFontSize() {
      bodyEl.style.fontSize = `${currentFontSize}px`;
    }

    // Scroll Reading Progress Indicator
    window.addEventListener('scroll', () => {
      const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
      if (totalHeight > 0) {
        const progress = (window.scrollY / totalHeight) * 100;
        scrollProgress.style.width = `${Math.min(100, Math.max(0, progress))}%`;
      }
    });

    // Event Listeners
    document.getElementById('menu-btn').onclick = () => toggleDrawer(true);
    document.getElementById('drawer-close').onclick = () => toggleDrawer(false);
    drawerOverlay.onclick = () => toggleDrawer(false);

    prevBtn.onclick = () => {
      if (currentIdx > 0) loadChapter(currentIdx - 1);
    };

    nextBtn.onclick = () => {
      if (currentIdx < CHAPTERS.length - 1) loadChapter(currentIdx + 1);
    };

    markBtn.onclick = () => {
      const id = CHAPTERS[currentIdx].id;
      if (completedChapters.includes(id)) {
        completedChapters = completedChapters.filter(x => x !== id);
      } else {
        completedChapters.push(id);
      }
      localStorage.setItem('ai_completed_chapters', JSON.stringify(completedChapters));
      updateDoneButton();
      renderChapterList(searchInput.value);
    };

    document.getElementById('font-btn').onclick = () => {
      currentFontSize = currentFontSize >= 21 ? 15 : currentFontSize + 1;
      localStorage.setItem('ai_font_size', currentFontSize);
      applyFontSize();
    };

    document.getElementById('theme-btn').onclick = () => {
      isDarkMode = !isDarkMode;
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('ai_theme', isDarkMode ? 'dark' : 'light');
      themeIcon.setAttribute('data-lucide', isDarkMode ? 'moon' : 'sun');
      lucide.createIcons();
    };

    searchInput.addEventListener('input', (e) => {
      renderChapterList(e.target.value);
    });

    // Initialize immediately or once DOM is ready
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>

# Chapter 2: Foundational Mechanics & Model Architecture

To operate as an end-to-end industry expert, you must look past the prompt window and understand how modern Large Language Models (LLMs) operate under the hood.

---

### 1. The Scaled Dot-Product Attention Core

At the center of every transformer architecture is the attention calculation:

$$\\text{Attention}(Q, K, V) = \\text{softmax}\\left(\\frac{QK^T}{\\sqrt{d_k}}\\right)V$$

- **Queries ($Q$):** What the current token is actively searching for.
- **Keys ($K$):** What prior tokens offer in the contextual horizon.
- **Values ($V$):** The semantic payload retrieved when Query matches Key.
- **Scaling Factor $\\sqrt{d_k}$:** Prevents dot products from exploding in high dimensions, which would saturate the softmax into zero-gradient zones.

For multi-head attention (MHA), the computation expands into $h$ distinct representation subspaces:

$$\\text{MultiHead}(Q, K, V) = \\text{Concat}(\\text{head}_1, \\dots, \\text{head}_h)W^O$$

where each head is $\\text{head}_i = \\text{Attention}(QW_i^Q, KW_i^K, VW_i^V)$.

---

### 2. KV Cache & Inference Latency

During autoregressive generation (the decoding phase), computing self-attention over previously produced tokens would require repetitive $O(N^2)$ FLOPs.

- **KV Caching:** We store key-value matrices in GPU VRAM (HBM) for past tokens so only the single newest token computes attention against cached state.
- **The Bottleneck:** Inference is rarely compute-bound; it is **memory bandwidth bound**. Moving the KV cache in and out of GPU registers dictates tokens per second (TPS).
- **VRAM Formula for KV Cache:**

$$\\text{KV Cache Size (Bytes)} = 2 \\times 2 \\times n_{\\text{layers}} \\times n_{\\text{heads}} \\times d_{\\text{head}} \\times n_{\\text{tokens}} \\times \\text{precision}$$

---

### 3. Parameter-Efficient Fine-Tuning (PEFT / LoRA)

Full-parameter fine-tuning of 70B models requires massive multi-node clusters. **LoRA (Low-Rank Adaptation)** fixes base model weights $W_0$ and trains small rank-decomposition matrices:

$$W = W_0 + \\Delta W = W_0 + \\frac{\\alpha}{r} (B \\times A)$$

where $B \\in \\mathbb{R}^{d \\times r}$ and $A \\in \\mathbb{R}^{r \\times k}$ with rank $r \\ll \\min(d, k)$. 

- **Memory Reduction:** Cuts trainable memory requirements by up to 90%.
- **Zero Latency Penalty:** At inference time, the low-rank delta $\\Delta W$ can be folded directly back into $W_0$.
        `

# Chapter 3: Vector Search & Advanced RAG Pipelines

Naive RAG (chunk $\\rightarrow$ embed $\\rightarrow$ top-k $\\rightarrow$ prompt) degrades rapidly in production environments. Building production-grade retrieval requires a multi-stage approach.

---

### 1. Ingestion & Semantic Chunking

- **Fixed-size Chunking (Fragile):** Arbitrary token limits (e.g., 512 tokens with 50-token overlap) split definitions and table rows across chunk boundaries.
- **Contextual Chunking:** Prepend parent document metadata or an LLM-generated chunk summary before embedding.
- **Semantic Window Retrieval:** Index tiny chunks (sentence-level) for precise vector matching, but return the surrounding sliding window of paragraphs to the model context.

---

### 2. Hybrid Retrieval: Dense + Sparse Fusion

- **Dense Vectors (Embeddings):** Understand semantic context, synonyms, and intent (e.g., \`text-embedding-3\`, \`BGE\`). Fail at alphanumeric identifiers, order numbers, or strict keyword lookups.
- **Sparse Vectors (BM25 / SPLADE):** Exact keyword and phrase matchers.
- **Reciprocal Rank Fusion (RRF):** Combine rankings deterministically:

$$RRF\\_Score(d) = \\sum_{m \\in M} \\frac{1}{k + r_m(d)}$$

where $M$ is the set of retrievers (e.g., Dense + BM25), $k \\approx 60$ is a smoothing constant, and $r_m(d)$ is the rank of document $d$ in system $m$.

---

### 3. Cross-Encoder Reranking

Vector similarity calculates dot-product angles independently (bi-encoder). Always pass the top 25–50 retrieved candidates through a **Cross-Encoder Reranker** (e.g., Cohere Rerank, BGE-Reranker-v2) to calculate true query-passage mutual interaction before injecting into the final context window.

# Chapter 4: Stateful Agentic Systems

Autonomous agents transition simple generation into stateful, loop-based execution engines equipped with external tools.

---

### 1. The Anatomy of an Agent Loop

\`\`\`text
User Query -> State Init -> LLM Decision -> Tool Call Needed?
                                │
             ┌──────────────────┴──────────────────┐
            YES                                   NO
             ▼                                     ▼
       Execute Tool                        Generate Response
             │                                     │
       Append Output                               ▼
             └───────────────────────────────> Update State -> End
\`\`\`

---

### 2. Escaping Fragile Prompt Chains

Early agent frameworks relied on naive text parsing (ReAct prompt scripts). Production agents are constructed as **State Graphs** (e.g., LangGraph):

1. **Nodes:** Plain functions that receive current state, perform an action (invoke model, query SQL DB, execute API), and return an updated partial state.
2. **Edges:** Conditional routers determining the next node based on structured outputs.
3. **Checkpointers:** Persisting graph state into Postgres/Redis to support pause/resume, human-in-the-loop approvals, and disaster recovery.

---

### 3. Enforcing Strict JSON Schemas

Never trust raw LLM output for tool execution. Bind function schemas via JSON Schema / Pydantic models. Validate system calls against type signatures before sending payloads to network layers.

# Chapter 5: Model Serving, Quantization & Latency

Serving models at scale requires reducing latency (Time To First Token - TTFT) and maximizing throughput (Tokens Per Second - TPS).

---

### 1. PagedAttention & Continuous Batching

Traditional serving frameworks pre-allocated fixed memory blocks for each request's maximum context length, wasting up to 60-80% of GPU memory.

- **PagedAttention (vLLM):** Allocates memory for keys and values in non-contiguous virtual pages, mirroring modern OS virtual memory paging.
- **Continuous Batching:** Dynamically inserts incoming requests into active GPU forward passes rather than waiting for an entire batch to finish generation.

---

### 2. Quantization Standards

| Format | Bit Width | Memory Footprint | Primary Use Case |
|---|---|---|---|
| **FP16 / BF16** | 16 bits | 2 GB per 1B params | Training & baseline precision |
| **AWQ / GPTQ** | 4 bits | ~0.65 GB per 1B params | GPU cloud inference at scale |
| **GGUF** | 4–8 bits | Variable | Local CPU/Metal/Edge runtimes |

---

### 3. Speculative Decoding

Run a tiny draft model (e.g., 1B parameter model) to speculatively output candidate tokens in rapid succession. The massive target model (e.g., 70B parameter model) validates all candidate tokens concurrently in a single forward pass, providing a **2x–3x speedup with zero mathematical loss in accuracy**.

# Chapter 6: Automated Evaluations & Security Guardrails

You cannot improve what you cannot measure. Production AI systems require continuous deterministic and probabilistic evaluation pipelines.

---

### 1. The RAG Triad Metrics

1. **Context Relevance:** Did the retriever fetch chunks strictly relevant to the user query?
2. **Groundedness / Faithfulness:** Is every claim in the generated answer supported directly by the retrieved context?
3. **Answer Relevance:** Does the output directly answer the user prompt without tangential fluff?

---

### 2. LLM-as-a-Judge Design Rules

When using an LLM to evaluate another LLM:
- **Calibrate with Few-Shot Rubrics:** Provide explicit 1-5 scoring anchors with annotated historical examples.
- **Chain of Thought First:** Force the evaluator model to generate reasoning justification before emitting a final score token.
- **Permutation Invariance:** Swap candidate output orders when running comparative A/B judgements to negate position bias.

---

### 3. Defending Prompt Injections & Jailbreaks

- **Delimiter Sandboxing:** Wrap untrusted user inputs in XML/Markdown blocks and explicitly instruct the model to treat content within those tags strictly as data, never as system instructions.
- **Dual-Model Guards:** Route ambiguous requests through a lightweight classifier (or guardrail service) that scores adversarial intent before passing inputs to downstream execution tools.

    // Initialize Application
    function init() {
      // Setup Theme
      if (!isDarkMode) {
        document.documentElement.classList.remove('dark');
        themeIcon.setAttribute('data-lucide', 'sun');
      } else {
        document.documentElement.classList.add('dark');

      // Check Saved Progress
      const savedChapter = localStorage.getItem('ai_last_chapter_idx');
      if (savedChapter !== null && CHAPTERS[savedChapter]) {
        currentIdx = parseInt(savedChapter);

      renderChapterList();
      loadChapter(currentIdx);
      applyFontSize();
      lucide.createIcons();

      // Register Service Worker for Offline PWA Support
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(() => {
            const pwaStatus = document.getElementById('pwa-status');
            if (pwaStatus) pwaStatus.innerText = 'PWA Offline Ready';
          })
          .catch((err) => console.log('SW registration note:', err));
      }
    }

    function renderChapterList(filterText = '') {
      chaptersList.innerHTML = '';
      const query = filterText.toLowerCase().trim();

      CHAPTERS.forEach((ch, idx) => {
        if (query && !ch.title.toLowerCase().includes(query) && !ch.summary.toLowerCase().includes(query)) {
          return;
        }

        const isDone = completedChapters.includes(ch.id);
        const isActive = idx === currentIdx;
        const item = document.createElement('button');
        item.className = `w-full text-left p-3 rounded-xl flex items-center justify-between text-sm transition-all ${
          isActive 
            ? 'bg-brand-500/15 dark:bg-brand-600/25 text-brand-600 dark:text-brand-400 font-semibold border border-brand-500/30'

        item.onclick = () => {
          loadChapter(idx);
          toggleDrawer(false);

        chaptersList.appendChild(item);

      completedCount.innerText = `${completedChapters.length}/${CHAPTERS.length} Done`;

    function loadChapter(idx) {

      const ch = CHAPTERS[idx];

      chapterPill.innerText = `Chapter ${idx + 1} of ${CHAPTERS.length}`;
      navTitle.innerText = ch.title;
      
      // Calculate reading time
      const wordCount = ch.markdown.split(/\s+/).length;
      const readMinutes = Math.max(1, Math.ceil(wordCount / 200));
      chapterReadTime.innerHTML = `<i data-lucide="clock" class="w-3.5 h-3.5"></i> ${readMinutes} min read (${wordCount} words)`;

      // Render Markdown
      bodyEl.innerHTML = marked.parse(ch.markdown);

      // Render KaTeX Math Equations
      if (window.renderMathInElement) {
        renderMathInElement(bodyEl, {
          delimiters: [

          ],
          throwOnError: false
        });

      // Add Copy Buttons to Code Blocks
      bodyEl.querySelectorAll('pre').forEach((pre) => {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-code-btn';
        copyBtn.innerHTML = '<i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy';
        copyBtn.onclick = () => {
          const code = pre.querySelector('code')?.innerText || pre.innerText;
          navigator.clipboard.writeText(code).then(() => {
            copyBtn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i> Copied';
            setTimeout(() => {
              copyBtn.innerHTML = '<i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy';
              lucide.createIcons();
            }, 2000);
          });

        pre.appendChild(copyBtn);

      // Update Navigation Buttons
      prevBtn.disabled = idx === 0;
      prevBtn.style.opacity = idx === 0 ? '0.4' : '1';
      prevBtn.style.pointerEvents = idx === 0 ? 'none' : 'auto';

      nextBtn.disabled = idx === CHAPTERS.length - 1;
      nextBtn.style.opacity = idx === CHAPTERS.length - 1 ? '0.4' : '1';
      nextBtn.style.pointerEvents = idx === CHAPTERS.length - 1 ? 'none' : 'auto';

      updateDoneButton();
      renderChapterList(searchInput.value);
      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateDoneButton() {
      const isDone = completedChapters.includes(CHAPTERS[currentIdx].id);
      if (isDone) {
        markBtn.classList.add('bg-emerald-500/20', 'border-emerald-500');
        markBtn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Completed';
        chapterStatusPill.className = 'px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-400 border border-emerald-500/30';
        chapterStatusPill.innerText = 'Completed';
      } else {
        markBtn.classList.remove('bg-emerald-500/20', 'border-emerald-500');
        markBtn.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4"></i> Mark Done';
        chapterStatusPill.className = 'px-2 py-0.5 rounded-full text-[11px] font-medium bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300';
        chapterStatusPill.innerText = 'In Progress';
      }
      lucide.createIcons();
    }

    function toggleDrawer(open) {
      if (open) {
        drawerOverlay.classList.remove('hidden');
        setTimeout(() => drawerOverlay.classList.remove('opacity-0'), 10);
        drawer.classList.remove('-translate-x-full');
      } else {
        drawerOverlay.classList.add('opacity-0');
        drawer.classList.add('-translate-x-full');
        setTimeout(() => drawerOverlay.classList.add('hidden'), 300);
      }
    }

    function applyFontSize() {
      bodyEl.style.fontSize = `${currentFontSize}px`;
    }

    // Scroll Reading Progress Indicator
    window.addEventListener('scroll', () => {
      const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
      if (totalHeight > 0) {
        const progress = (window.scrollY / totalHeight) * 100;
        scrollProgress.style.width = `${Math.min(100, Math.max(0, progress))}%`;
      }
    });

    // Event Listeners
    document.getElementById('menu-btn').onclick = () => toggleDrawer(true);
    document.getElementById('drawer-close').onclick = () => toggleDrawer(false);
    drawerOverlay.onclick = () => toggleDrawer(false);

    prevBtn.onclick = () => {
      if (currentIdx > 0) loadChapter(currentIdx - 1);
    };

    nextBtn.onclick = () => {
      if (currentIdx < CHAPTERS.length - 1) loadChapter(currentIdx + 1);
    };

    markBtn.onclick = () => {
      const id = CHAPTERS[currentIdx].id;
      if (completedChapters.includes(id)) {
        completedChapters = completedChapters.filter(x => x !== id);
      } else {
        completedChapters.push(id);
      }
      localStorage.setItem('ai_completed_chapters', JSON.stringify(completedChapters));
      updateDoneButton();
      renderChapterList(searchInput.value);
    };

    document.getElementById('font-btn').onclick = () => {
      currentFontSize = currentFontSize >= 21 ? 15 : currentFontSize + 1;
      localStorage.setItem('ai_font_size', currentFontSize);
      applyFontSize();
    };

    document.getElementById('theme-btn').onclick = () => {
      isDarkMode = !isDarkMode;
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('ai_theme', isDarkMode ? 'dark' : 'light');
      themeIcon.setAttribute('data-lucide', isDarkMode ? 'moon' : 'sun');
      lucide.createIcons();
    };

    searchInput.addEventListener('input', (e) => {
      renderChapterList(e.target.value);
    });

    // Initialize once DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
      init();
    });
  </script>
